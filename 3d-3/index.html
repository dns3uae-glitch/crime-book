<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>AI Crime Scene – Elite Investigator Edition (v9-fixed+smooth)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- A-Frame -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<!-- ✅ مهم: مكوّن animation-mixer من aframe-extras -->
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
<style>
:root{--gold:#d4af37;--dark:#0a0c0f;--glass:#0f1317cc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--dark);font-family:"Tajawal",system-ui,Arial;color:#fff}
a-scene{width:100%;height:100vh;z-index:1}

/* شاشة البداية */
#overlayStart{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(700px 420px at 50% 40%, rgba(212,175,55,.15), rgba(0,0,0,.8));
  z-index:12000;text-align:center;color:var(--gold);font-size:22px
}
#overlayStart, #overlayStart *{ pointer-events:auto !important; }
#overlayStart button{
  margin-top:20px;padding:10px 24px;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(90deg,var(--gold),#b78f2a);color:#000;font-weight:800;font-size:18px;
  box-shadow:0 0 14px rgba(212,175,55,.5); transition:transform .18s ease, box-shadow .18s ease, filter .2s ease
}
#overlayStart button:hover{ box-shadow:0 0 26px rgba(212,175,55,.85); filter:brightness(1.05) }
#overlayStart button:active{ transform:scale(.96) }

/* HUD */
#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;font-weight:800;z-index:11000;display:flex;gap:10px;align-items:center}
#time{color:#d4af37}
#status{color:#cfe1ff}
#score{color:#39d98a}

/* طبقة الواجهة */
#uiLayer{position:fixed;inset:0;z-index:10000;pointer-events:none}
#btnOpen{position:absolute;top:20px;right:20px;pointer-events:auto;width:56px;height:56px;border:none;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 30%, var(--gold), #b78f2a);color:#000;font-weight:900;font-size:22px;box-shadow:0 0 12px rgba(212,175,55,.6)}

/* القائمة */
#sidebar{position:absolute;top:0;right:0;width:400px;height:100%;background:var(--glass);backdrop-filter:blur(14px);border-left:1px solid rgba(255,255,255,.12);padding:14px;overflow:auto;transition:right .45s ease;pointer-events:auto;z-index:10001}
#sidebar.hidden{right:-420px}
#sidebarHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#btnClose{pointer-events:auto;border:none;background:transparent;color:#fff;font-size:20px;cursor:pointer}
h2{color:var(--gold);margin:12px 0 8px}
.btn{background:linear-gradient(90deg,var(--gold),#b78f2a);color:#000;font-weight:800;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:0 0 12px rgba(212,175,55,.4)}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:#d6dbe3;border-radius:10px;padding:7px 10px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#0c1014;color:#fff}
.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:rgba(255,255,255,.05);border-radius:12px;padding:10px;text-align:center;box-shadow:inset 0 0 14px rgba(212,175,55,.12);transition:.25s;cursor:pointer}
.card:hover{box-shadow:0 0 20px rgba(212,175,55,.28)}
.card .btn{width:100%;margin-top:6px}

/* 🟡 مستطيل التحكّم العام */
.dynamic-controls {
  position: fixed;
  left: 20px;
  bottom: 140px;
  width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  z-index: 10020;
  /* 🚫 حذف الإطار والخلفية والظل */
  background: none !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}


/* 🎯 الدائرة */
.obj-joystick {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(10,12,15,0.7);
  border: 3px solid rgba(212,175,55,0.18);
  display: grid;
  place-items: center;
  box-shadow: 0 6px 16px rgba(0,0,0,0.5);
  touch-action: none;
  margin-bottom: 6px; /* 🔹 مسافة صغيرة قبل المستطيل */
}

.obj-joy-knob {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff, #d4af37);
  transform: translate(0,0);
  transition: transform 0.05s linear;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

/* 🔘 المستطيل السفلي */
.controls-bar {
  width: 100%;
  background: rgba(4,5,7,0.45);
  border: 2px solid rgba(212,175,55,0.15);
  border-radius: 14px;
  padding: 10px 8px;
  display: flex;
  justify-content: space-between; /* 🔹 توزيع الأزرار بالتساوي */
  gap: 6px;
}

/* الأزرار */
.ctrl-btn {
  flex: 1;
  max-width: 45px;
  height: 38px;
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(212,175,55,0.4);
  color: #FFD54A;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}

.ctrl-btn:hover {
  background: rgba(255,255,255,0.1);
  transform: translateY(-2px);
}
/* نافذة إدخال الملاحظة */
#noteModal {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  z-index: 12001;
  background: radial-gradient(600px 320px at 50% 40%, rgba(212,175,55,.12), rgba(0,0,0,.65));
}
.noteCard {
  width: min(92vw,520px);
  background: #0b0f13f2;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 0 22px rgba(212,175,55,.35);
}
.noteCard .row { justify-content: flex-end; }

/* Toast */
.toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.75);
  padding: 10px 14px;
  border-radius: 10px;
  display: none;
  z-index: 11000;
}

/* === التحسينات الجديدة للجوال والاتجاه === */
@media (max-width: 768px) {
  .dynamic-controls, .camera-controls {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 12, 15, 0.85);
    padding: 8px 10px;
    border-radius: 14px;
    box-shadow: 0 0 10px rgba(212,175,55,0.25);
  }

  .dynamic-controls {
    bottom: 110px; /* فوق الكاميرا */
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    width: 92vw;
  }

  .camera-controls {
    bottom: 20px;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    width: 92vw;
  }

  .ctrl-btn, .cam-btn {
    width: 38px;
    height: 38px;
    font-size: 16px;
  }
}

/* 💻 للشاشات المتوسطة */
@media (min-width: 769px) and (max-width: 1200px) {
  .dynamic-controls, .camera-controls {
    transform: none;
    left: auto;
    right: 20px;
    background: rgba(10,12,15,0.65);
  }
}

@keyframes fadeInReport {
  0% { opacity: 0; transform: scale(0.9); }
  60% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 1; transform: scale(1); }
}

#overlayEnd {
  animation: fadeInReport 0.9s ease forwards;
  opacity: 0;
}


/* 📱 الوضع العمودي (Portrait) */
@media (orientation: portrait) {
  .dynamic-controls {
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%);
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    width: 92vw;
  }
  .camera-controls {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    width: 92vw;
  }
  #sidebar {
    width: 100%;
    height: 50%;
    bottom: 0;
    right: 0;
    border-left: none;
    border-top: 1px solid rgba(255,255,255,.12);
    border-radius: 12px 12px 0 0;
  }
}

/* 💻 الوضع الأفقي (Landscape) */
@media (orientation: landscape) {
  .dynamic-controls {
    bottom: 20px;
    left: 20px;
    flex-direction: column;
    gap: 6px;
    transform: none;
  }
  .camera-controls {
    right: 20px;
    left: auto;
    bottom: 20px;
    transform: none;
    flex-direction: column;
    gap: 6px;
  }
  #sidebar {
    width: 380px;
    height: 100%;
    top: 0;
    right: 0;
    border-left: 1px solid rgba(255,255,255,.12);
    border-top: none;
    border-radius: 0;
  }
}

/* fallback للهواتف الصغيرة جدًا */
@media (max-width: 600px) {
  .ctrl-btn, .cam-btn { width: 34px; height: 34px; font-size: 15px; }
}
/* 🎯 تحسين خاص للوضع الأفقي في الجوال لتجنب تغطية المشهد */
@media (orientation: landscape) and (max-height: 500px) {
  .dynamic-controls, .camera-controls {
    background: rgba(10,10,10,0.45); /* شفافية أكبر */
    padding: 6px;
    border-radius: 10px;
    flex-direction: row; /* صف واحد فقط */
    flex-wrap: nowrap;
    justify-content: center;
    gap: 4px;
    width: 96vw;
    left: 50%;
    transform: translateX(-50%);
  }

  .dynamic-controls {
    bottom: 60px; /* ترفعها قليلاً فوق أزرار الكاميرا */
  }

  .camera-controls {
    bottom: 10px; /* تبقى في الأسفل */
  }

  .ctrl-btn, .cam-btn {
    width: 32px;
    height: 32px;
    font-size: 14px;
    opacity: 0.85;
  }

  #sidebar {
    width: 320px;
    background: rgba(15,15,15,0.9);
  }
}
/* 📱 ضمان ثبات الأزرار في المنتصف للجوال حتى عند الوضع الأفقي */
@media (max-width: 900px) and (orientation: landscape) {
  .camera-controls,
  .dynamic-controls {
    position: fixed;
    left: 50%;
    transform: translateX(-50%); /* تبقى في المنتصف */
    width: auto;
    max-width: 90vw;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dynamic-controls {
    bottom: 100px; /* فوق أزرار الكاميرا */
  }

  .camera-controls {
    bottom: 20px; /* تبقى في الأسفل */
  }

  .ctrl-btn, .cam-btn {
    width: 36px;
    height: 36px;
    font-size: 15px;
  }
}
/* ✨ الباب البرمجي والانفجار */
#doorOverlay {
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#000;z-index:20000;overflow:hidden;
}
#leftDoor, #rightDoor {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;

  /* ✨ مزيج من السلفر والنحاس */
  background: linear-gradient(135deg, #b8b8b8 0%, #c7a06a 35%, #5f5f5f 100%);
  background-blend-mode: overlay;

  /* ✨ تأثير الصفائح المعدنية */
  background-image:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 2px,
      transparent 2px,
      transparent 6px
    ),
    linear-gradient(160deg, #d0b07833 0%, #333 100%);

  border: 1px solid rgba(200,160,90,0.35);
  border-left: none;
  border-right: none;

  /* ✨ ظلال واقعية */
  box-shadow:
    inset 0 0 60px rgba(255, 255, 255, 0.1),
    inset 0 0 25px rgba(0,0,0,0.6),
    0 0 50px rgba(0,0,0,0.8);

  filter: brightness(0.95) contrast(1.1);
  transition: transform 2.8s ease-in-out, filter 0.3s ease;
}

/* ✨ عند مرور الفأرة يعطي لمعة معدنية */
#leftDoor:hover, #rightDoor:hover {
  filter: brightness(1.15) saturate(1.2);
  box-shadow:
    inset 0 0 80px rgba(255,220,150,0.25),
    0 0 40px rgba(198,169,116,0.4);
}

/* ✊ مقابض بسيطة بلون نحاسي في المنتصف */
#leftDoor::after, #rightDoor::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 18px;
  height: 80px;
  border-radius: 6px;
  background: linear-gradient(180deg, #c6a974 0%, #7b5f2a 100%);
  box-shadow:
    inset 0 0 6px rgba(255,255,255,0.4),
    0 0 10px rgba(0,0,0,0.6);
}

#leftDoor::after {
  right: 25px;
  transform: translateY(-50%);
}
#rightDoor::after {
  left: 25px;
  transform: translateY(-50%);
}

#leftDoor{left:0;transform-origin:left center;}
#rightDoor{right:0;transform-origin:right center;}
#fxSmoke,#fxParticles{position:absolute;inset:0;pointer-events:none;}
.smoke{
  position:absolute;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(80,160,255,.6),rgba(20,50,100,.2),transparent);
  opacity:0;mix-blend-mode:screen;filter:blur(5px)
}
.particle{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,rgba(180,240,255,.9),rgba(0,100,200,.3),transparent);
  opacity:0;
}
@keyframes shake {
  0%,100% {transform:translate(0,0);}
  20% {transform:translate(-6px,-4px);}
  40% {transform:translate(6px,8px);}
  60% {transform:translate(-5px,4px);}
  80% {transform:translate(8px,-6px);}
}
.shake {animation:shake 0.4s ease-in-out 4;}


/* 🎨 زر البداية بلون واجهة المسرح */
#btnDoorStart {
  position: absolute;         /* 🔹 خله مطلق داخل الباب */
  bottom: 140px;              /* 🔹 نزّل الزر تحت القبضات */
  left: 50%;                  /* 🔹 وسط الصفحة */
  transform: translateX(-50%);/* 🔹 لتوسيط الزر تماماً */

  z-index: 100;
  padding: 16px 46px;
  border: 2px solid rgba(212,175,55,0.25);
  border-radius: 14px;
  cursor: pointer;
  font-size: 22px;
  font-weight: 800;
  color: #d4af37;
  background: linear-gradient(180deg, #0a0c0f 0%, #162233 100%);
  box-shadow: inset 0 0 18px rgba(255,255,255,0.05),
              0 0 22px rgba(13,27,42,0.6);
  transition: transform 0.2s ease, box-shadow 0.3s ease, filter 0.3s ease;
  animation: deepGlow 2s infinite ease-in-out;
}

#btnDoorStart:hover {
  transform: translateX(-50%) scale(1.08); /* 👈 موازنة اللمعة مع الموقع */
  box-shadow: inset 0 0 25px rgba(212,175,55,0.25),
              0 0 30px rgba(212,175,55,0.3);
  filter: brightness(1.15);
}

@keyframes deepGlow {
  0%, 100% { box-shadow: 0 0 18px rgba(212,175,55,0.18); }
  50% { box-shadow: 0 0 28px rgba(212,175,55,0.38); }
}

/* 🔒 إخفاء زر VR تماماً في جميع نسخ A-Frame */
a-enter-vr-button,
a-enter-ar-button,
button.a-enter-vr-button,
button.a-enter-ar {
  display: none !important;
  opacity: 0 !important;
  pointer-events: none !important;
  visibility: hidden !important;
}

</style></head>
<body>

<!-- البداية بالصوت + زر يعمل دائمًا -->
<div id="overlayStart">
  <div>مرحبًا بكم في إعادة بناء مسرح الجريمة<br>اضغط للبدء</div>
  <button id="btnStart" onclick="startApp()">ابدأ</button>
</div>

<!-- HUD -->
<div id="hud">
  ⏱ <span id="time">--:--</span> | <span id="status">جاهز</span> | 🧮 <span id="score">0</span>
</div>

<!-- المشهد -->
<a-scene embedded renderer="antialias:true; colorManagement:true" touch-action="pan-y">
  <!-- الأرضية والجدران كما هي -->
  <a-plane id="floor" rotation="-90 0 0" width="30" height="30"
           material="src: url(https://cdn.polyhaven.com/asset_img/primary/long_white_tiles.png?height=760&quality=95); repeat: 1 15;"
           class="clickable"></a-plane>
  <a-entity id="rig" position="0 1.6 6"><a-entity camera look-controls wasd-controls="acceleration:30"></a-entity></a-entity>

  <a-entity id="ray" cursor="rayOrigin:mouse" raycaster="objects:.clickable,.placed,.noteMarker"></a-entity>


</a-scene>

<!-- واجهة -->
<div id="uiLayer">
  <button id="btnOpen">≡</button>
  <aside id="sidebar" class="hidden">
    <div id="sidebarHead">
      <div style="color:#d4af37;font-weight:800">لوحة التحكم</div>
      <button id="btnClose" title="إغلاق">✕</button>
    </div>

    <!-- مكتبة الأدلة -->
    <h2>📦 مكتبة الأدلة</h2>
    <div id="library" class="library"></div>

    <h2>➕ إضافة عنصر خارجي</h2>
    <div class="row">
      <input id="customName" type="text" placeholder="اسم العنصر">
      <input id="customURL" type="text" placeholder="رابط النموذج (.glb)">
      <button class="btn" id="btnAddCustom">إضافة</button>
    </div>

    <h2>🧩 العناصر الموضوعة</h2>
    <select id="placedList" size="6" style="width:100%"></select>
    <div class="row">
      <button class="btn-ghost" id="btnDelete">🗑 حذف العنصر</button>
      <button class="btn-ghost" id="btnReset">🔄 إعادة ضبط المشهد</button>
    </div>

    <h2>✅❌ تقييم الأدلة</h2>
    <div class="row">
      <select id="evidenceSel">
        <option value="none" selected>— بدون تقييم —</option>
        <option value="true">✔️ دليل صحيح</option>
        <option value="false">❌ دليل خاطئ</option>
      </select>
      <button class="btn" id="btnApplyEvidence">تطبيق</button>
    </div>

    <h2>🧪 الاختبار</h2>
    <div class="row">
      <input id="duration" type="number" value="120" title="المدة بالثواني">
      <button class="btn" id="btnGameStart">بدء</button>
      <button class="btn-ghost" id="btnGameStop">إيقاف</button>
      <button class="btn-ghost" id="btnGameFinalize">اعتماد</button>
    </div>

<h2>🗒️ الملاحظات</h2>
<div class="row">
  <button class="btn" id="btnNoteMode">➕ إضافة ملاحظة</button>
  <button class="btn-ghost" onclick="deleteNotes()">🗑️ حذف الملاحظات</button>
</div>

    <h2>⚙️ إعدادات التحريك</h2>
    <div class="row">
      <label style="font-size:12px;color:#cdd6e1">سرعة الحركة:</label>
      <select id="stepSel">
        <option value="0.05">بطيئة (0.05)</option>
        <option value="0.1" selected>متوسطة (0.1)</option>
        <option value="0.25">سريعة (0.25)</option>
        <option value="0.5">عالية (0.5)</option>
      </select>
    </div>
  </aside>
</div>

<!-- تحكم بالعنصر (يسار) -->
<div id="controls" class="dynamic-controls">

  <!-- 🕹️ دائرة التحريك -->
  <div class="obj-joystick" id="objJoy">
    <div class="obj-joy-knob" id="objJoyKnob"></div>
  </div>

  <!-- 🔘 الأزرار داخل مستطيل واحد -->
  <div class="controls-bar">
    <button class="ctrl-btn" data-act="zoomIn" title="امام">🔼</button>
    <button class="ctrl-btn" data-act="zoomOut" title="خلف">🔽</button>
    <button class="ctrl-btn" data-act="rotL" title="تدوير يمين">⟳</button>
    <button class="ctrl-btn" data-act="rotR" title="تدوير يسار">⟲</button>
    <button class="ctrl-btn" data-act="tilt" title="ميل">📐</button>
    <button class="ctrl-btn" data-act="shrink" title="تصغير">🔹</button>
    <button class="ctrl-btn" data-act="grow" title="تكبير">➕</button>
  </div>

</div>

<!-- 🎮 تحكم بالكاميرا (Joystick + Zoom Levels + Walk + Lift) -->
<style>
  /* 🎨 تصميم جديد لواجهة الكاميرا */
.camera-joystick {
  position: fixed;
  right: 20px;              /* 🔹 نقلها لليمين */
  bottom: 18px;
  z-index: 10005;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  pointer-events: auto;
  transition: right 0.45s ease; /* ✅ حركة ناعمة */
}

/* 🎯 تعديل مستوى زر الانخفاض / الارتفاع فقط */
.ctrl-section:last-child {
  margin-top: -12px !important; /* 🔹 ارفع الزر قليلاً */
}

/* 🎯 الدائرة */
.joy-wrap {
  width: 110px;
  height: 110px;

<script>
(function(){
  const rig = document.getElementById("rig");
  const joyWrap = document.getElementById("joyWrap");
  const joyKnob = document.getElementById("joyKnob");
  const zoomSlider = document.getElementById("zoomSlider");
  const walkSlider = document.getElementById("walkSlider");
  const liftSlider = document.getElementById("liftSlider");
  const cam = document.querySelector("[camera]");
  const sideSlider = document.getElementById("sideSlider");
  if (!rig || !cam) return;

  // 🧭 إعدادات عامة
  const rotationSmooth = 0.15;
  const walkSpeed = 0.22;
  const baseFOV = 80;   // FOV الأساسي
  const minFOV  = 8;   // أقوى تقريب
  const maxZoom = 10;   // حد السلايدر
  const zoomSmooth = 0.15;
  let pendingFOV = baseFOV;

  // 🎮 حالة الجويستك
  let active=false, baseRect, maxRadius=36, current={x:0,y:0}, yaw=0,pitch=0;

  function startJoy(e){
    e.preventDefault();
    active=true;
    baseRect=joyWrap.getBoundingClientRect();
    maxRadius=Math.min(baseRect.width,baseRect.height)*0.38;
    updateJoy(e);
  }
  function stopJoy(){
    active=false;
    current={x:0,y:0};
    joyKnob.style.transform="translate(0,0)";
joyKnob.style.transition = "transform 0.25s cubic-bezier(.34,1.56,.64,1)";

  }
  function updateJoy(e){
    const t=(e.touches&&e.touches[0])||e;
    const cx=baseRect.left+baseRect.width/2;
    const cy=baseRect.top+baseRect.height/2;
    const dx=t.clientX-cx;
    const dy=t.clientY-cy;
    const dist=Math.hypot(dx,dy);
    const r=Math.min(dist,maxRadius);
    const nx=(r===0)?0:(dx/dist)*r;
    const ny=(r===0)?0:(dy/dist)*r;
    joyKnob.style.transform=`translate(${nx}px,${ny}px)`;
    current.x=nx/maxRadius;
    current.y=ny/maxRadius;
  }

  // ⚙️ الحركة الأمامية والخلفية
  let walkValue = 0;
  walkSlider.addEventListener("input", e => {
    walkValue = parseFloat(e.target.value);
  });
  function resetWalkToCenter(){
    let animFrame;
    const smoothReturn = () => {
      let val = parseFloat(walkSlider.value);
      if (Math.abs(val) <= 0.03) {
        walkSlider.value = 0;
        walkValue = 0;
        cancelAnimationFrame(animFrame);
        return;
      }
      val *= 0.55;
      walkSlider.value = val.toFixed(3);
      walkValue = parseFloat(val);
      animFrame = requestAnimationFrame(smoothReturn);
    };
    animFrame = requestAnimationFrame(smoothReturn);
  }
  walkSlider.addEventListener("mouseup", resetWalkToCenter);
  walkSlider.addEventListener("touchend", resetWalkToCenter);
  walkSlider.addEventListener("mouseleave", resetWalkToCenter);

  // ⬆️⬇️ الارتفاع
  let liftValue = 0;
  liftSlider.addEventListener("input", e => {
    liftValue = parseFloat(e.target.value);
  });
  // ↔️ التحرك يمين / يسار
  let sideValue = 0;
  sideSlider.addEventListener("input", e => {
    sideValue = parseFloat(e.target.value);
  });
// 🧲 رجوع تلقائي للسلايدر للمنتصف عند عدم اللمس
sideSlider.addEventListener("mouseup", () => {
  smoothReturnToCenter();
});
sideSlider.addEventListener("touchend", () => {
  smoothReturnToCenter();
});

function smoothReturnToCenter() {
  const start = parseFloat(sideSlider.value);
  const duration = 250; // ⏱ مدة الرجوع بالمللي ثانية (يمكن تقليلها لسرعة أكبر)
  const startTime = performance.now();

  function animateReturn(now) {
    const elapsed = now - startTime;
    const t = Math.min(1, elapsed / duration); // نسبة التقدم 0 → 1
    const eased = 1 - Math.pow(1 - t, 3); // منحنى تخفيف CubicEaseOut
    const newVal = start * (1 - eased);

    sideSlider.value = newVal.toFixed(3);
    sideValue = parseFloat(sideSlider.value);

    if (t < 1) {
      requestAnimationFrame(animateReturn);
    } else {
      sideSlider.value = 0;
      sideValue = 0;
    }
  }

  requestAnimationFrame(animateReturn);
}


  // 🔭 الزووم البصري الحقيقي (FOV Zoom)
  zoomSlider.addEventListener("input", e => {
    const val = parseFloat(e.target.value);
    const t = val / maxZoom;
    pendingFOV = THREE.MathUtils.lerp(baseFOV, minFOV, t);
  });

  // 🔁 الحلقة الرئيسية
  function tick(){
    if(active){
      yaw += (-current.x) * 1.8;
      pitch += (-current.y) * 1.4;
      pitch = Math.max(-80, Math.min(80, pitch));
    }

    const rot = rig.getAttribute("rotation");
const newYaw   = rot.y + (yaw - rot.y) * rotationSmooth;
const newPitch = rot.x + (pitch - rot.x) * rotationSmooth;
rig.setAttribute("rotation", `${newPitch} ${newYaw} 0`);

const pos = rig.getAttribute("position");

// 🔹 تحديد موقع الكاميرا الابتدائي (مرة واحدة فقط)
if (!window.initialCameraSet) {
  // 📍 نفس إحداثيات المشهد اللي أرسلتها بالضبط
  pos.x = -0.15;
  pos.y = 0.92;
  pos.z = 5.6;

  rig.setAttribute("rotation", "0 -27 0"); // نفس زاوية المشهد

  window.initialCameraSet = true;
}


pos.y += ((1.6 + liftValue * 6.0) - pos.y) * 0.1;

if (Math.abs(walkValue) > 0.0001){
  const dir = new THREE.Vector3();
  cam.object3D.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();

  // 🔄 عكس الاتجاه: سحب لليمين = للخلف، سحب لليسار = للأمامa
  pos.x -= dir.x * walkValue * walkSpeed;
  pos.z -= dir.z * walkValue * walkSpeed;
}

  // حركة السحب يمين / يسار (اتجاه صحيح)
if (Math.abs(sideValue) > 0.0001) {
  const right = new THREE.Vector3();
  cam.object3D.getWorldDirection(right);
  right.y = 0;
  right.normalize();
  // 👇 بدّل الترتيب لعكس الاتجاه العكسي الخطأ
  right.crossVectors(new THREE.Vector3(0, 1, 0), right);
pos.x -= right.x * sideValue * walkSpeed;
pos.z -= right.z * sideValue * walkSpeed;

}



    // 🔧 تحديث الزاوية البصرية (زووم)
    const camObj = cam.getObject3D("camera");
    if (camObj && camObj.isCamera) {
      camObj.fov += (pendingFOV - camObj.fov) * zoomSmooth;
      camObj.updateProjectionMatrix();
    }

    rig.setAttribute("position", `${pos.x} ${pos.y} ${pos.z}`);
    requestAnimationFrame(tick);
  }
  tick();

  // تفعيل الجويستك
  joyWrap.addEventListener("pointerdown",(e)=>{joyWrap.setPointerCapture(e.pointerId);startJoy(e);});
  window.addEventListener("pointermove",(e)=>{if(active)updateJoy(e);});
  window.addEventListener("pointerup",()=>{if(active)stopJoy();});

  // لوحة المفاتيح
  window.addEventListener("keydown", e => {
    const pos = rig.getAttribute("position");
    const dir = new THREE.Vector3();
    cam.object3D.getWorldDirection(dir);
    dir.y = 0;
    dir.normalize();
    const step = 0.25;
    switch (e.code) {
      case "ArrowUp":case "KeyW": pos.x += dir.x * step; pos.z += dir.z * step; break;
      case "ArrowDown":case "KeyS": pos.x -= dir.x * step; pos.z -= dir.z * step; break;
      case "ArrowLeft":case "KeyA": pos.x += dir.z * step; pos.z -= dir.x * step; break;
      case "ArrowRight":case "KeyD": pos.x -= dir.z * step; pos.z += dir.x * step; break;
    }
    rig.setAttribute("position", `${pos.x} ${pos.y} ${pos.z}`);
  });


})();
</script>

/* ========== أدوات مساعدة للتحريك السلس ========== */
function lerp(a,b,t){ return a + (b-a)*t; }
function animate(duration, step, done){
  const start = performance.now();
  function frame(now){
    const p = Math.min(1, (now - start) / duration);
    step(p);
    if(p < 1) requestAnimationFrame(frame); else if(done) done();
  }
  requestAnimationFrame(frame);
}
function getVec3(attr){ return {x:attr.x||0,y:attr.y||0,z:attr.z||0}; }

function tweenPosition(ent, to, duration=200){
  const from = getVec3(ent.getAttribute('position')||{x:0,y:0,z:0});
  animate(duration, p=>{
    ent.setAttribute('position', {x:lerp(from.x,to.x,p), y:lerp(from.y,to.y,p), z:lerp(from.z,to.z,p)});
  });
}
function tweenDeltaPosition(ent, dx,dy,dz, duration=200){
  const from = getVec3(ent.getAttribute('position')||{x:0,y:0,z:0});
  tweenPosition(ent, {x:from.x+dx,y:from.y+dy,z:from.z+dz}, duration);
}
function tweenRotationY(ent, deltaDeg, duration=200){
  const from = ent.getAttribute('rotation') || {x:0,y:0,z:0};
  const toY = from.y + deltaDeg;
  animate(duration, p=>{
    ent.setAttribute('rotation', {x:from.x,y:lerp(from.y,toY,p),z:from.z});
  });
}
function tweenScaleFactor(ent, factor, duration=200){
  const s = ent.getAttribute('scale') || {x:1,y:1,z:1};
  const to = {x:s.x*factor, y:s.y*factor, z:s.z*factor};
  animate(duration, p=>{
    ent.setAttribute('scale',{x:lerp(s.x,to.x,p), y:lerp(s.y,to.y,p), z:lerp(s.z,to.z,p)});
  });
}

/* ========================

/* ========================
/* ========================
   🧩 وضع العنصر داخل الغرفة بدقة فوق الأرضية + تصغير تلقائي
   ======================== */
function placeModel(i){
  const m = library[i];
  if(!m) return;

  const id = 'ent-' + Date.now();
  const ent = document.createElement('a-entity');
  ent.setAttribute('id', id);
  ent.setAttribute('gltf-model', m.url);
  ent.classList.add('placed', 'clickable');
  ent.setAttribute('data-valid', 'none');
  ent.setAttribute('data-scored', 'no');

  // موضع مبدئي (نفس مكان السرير / منتصف الغرفة أمام الكاميرا)
  // سنضبط الارتفاع بدقة بعد تحميل النموذج
  ent.setAttribute('position', '0 0 -2.8');
  ent.setAttribute('rotation', '0 180 0');

  // عند اكتمال تحميل النموذج نحسب الـBounding Box ونضبط الحجم والارتفاع
  ent.addEventListener('model-loaded', (e)=>{

    const THREE = (window.AFRAME && AFRAME.THREE) ? AFRAME.THREE : window.THREE;
    if(!THREE) { console.warn('THREE غير متاح'); return; }

    // جذر نموذج الـGLTF المحمل
    const root = e.detail.model || ent.getObject3D('mesh');
    if(!root){ console.warn('لم يتم العثور على جذر النموذج'); return; }

    // حدود النموذج قبل أي تحجيم
    const bbox = new THREE.Box3().setFromObject(root);
    const size = bbox.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    // 👇 تصغير تلقائي: نجعل أكبر بُعد ≈ 1 متر كحد أقصى، ولا نكبّر نماذج صغيرة
    // ونضع سقفًا أعلى للحجم (0.35) حتى تظل العناصر صغيرة نسبيًا داخل الغرفة
    let s = Math.min(0.35, 1.0 / (maxDim || 1)); // لو maxDim كبير جدًا => s صغير
    if(!isFinite(s) || s <= 0) s = 0.2;          // احتياط

    // طبّق المقياس على الكيان (موحّد)
    ent.setAttribute('scale', `${s} ${s} ${s}`);

    // نحسب أدنى نقطة للنموذج بعد التحجيم: minY_scaled = s * bbox.min.y
    // ونرفع/نخفض العنصر بحيث يصبح قاعه عند الأرضية (y ≈ 0.02)
    const minY = bbox.min.y;
    const groundY = 0.02;
    const pos = ent.getAttribute('position');
    pos.x = 0;
    pos.z = -2.8;                  // داخل الغرفة أمام الكاميرا
    pos.y = groundY - (s * minY);  // هبوط دقيق على الأرضية مهما كان محور النموذج
    ent.setAttribute('position', pos);
  });

  // صندوق تفاعلي غير مرئي (للنقر/التحديد) — لا يؤثر على الـbbox لأنه طفل للكيان
  const col = document.createElement('a-box');
  col.setAttribute('width','1.2');
  col.setAttribute('height','1.8');
  col.setAttribute('depth','1.2');
  col.setAttribute('opacity','0');
  col.setAttribute('position','0 0.9 0');
  col.classList.add('clickable');
  ent.appendChild(col);

  // أضف للمشهد + حدث الحفظ والقائمة
  scene.appendChild(ent);
  placed.push({ id, name: m.name, el: ent, scored: false });

  const opt = document.createElement('option');
  opt.value = id;
  opt.textContent = m.name;
  placedList.appendChild(opt);

  selectById(id);
  msg('تم وضع ' + m.name + ' داخل الغرفة فوق الأرضية وبحجم صغير متناسق');
  saveScene();
}





function selectById(id){
  const rec = placed.find(p=>p.id===id);
  if(!rec) return;
  selected = rec.el;
  placedList.value = id;
  evidenceSel.value = selected.getAttribute('data-valid') || 'none';
  window.selected = selected; // ✅ تحديث الجويستك ليعمل مع العنصر الجديد
}

placedList.onchange = e => selectById(e.target.value);
scene.addEventListener('click', e => {
  const target = e.target;
  const clickedEntity = findAncestor(target, el => el.classList.contains('placed'));
  if(!clickedEntity) return;
selected = clickedEntity; // ← يربط العنصر المختار بالجويستك

  const rec = placed.find(p => p.el === clickedEntity);
  if(!rec || rec.scored) return;

  const val = clickedEntity.getAttribute('data-valid');
  if(val === 'true'){
    addScore(10);
    rec.scored = true;
    clickedEntity.setAttribute('data-scored','yes');
    msg('✅ تم احتساب نقطة للدليل الصحيح');
  } else if(val === 'false'){

    rec.scored = true;
    clickedEntity.setAttribute('data-scored','yes');
    msg('❌ تم خصم نقطة للدليل الخاطئ');
  }
});

function findAncestor(el, pred){
  let cur = el;
  while(cur && cur !== scene){
    if(pred(cur)) return cur;
    cur = cur.parentEl;
  }
  return null;
}

/* تحريك العنصر تدريجيًا: زوم إن/أوت، تكبير/تصغير تدريجي */
function stepVal(){ return parseFloat(document.getElementById('stepSel').value)||0.1; }
function zoomSelected(deltaZ){
  if(!selected){ msg('اختر عنصرًا أولًا'); return; }
  const p = selected.getAttribute('position') || {x:0,y:0,z:0};
  tweenDeltaPosition(selected, 0, 0, deltaZ, 220);
}
function rotateSelected(deltaY){
  if(!selected){ msg('اختر عنصرًا أولًا'); return; }
  tweenRotationY(selected, deltaY, 220);
}
function tiltSelected(){
  if(!selected){ msg('اختر عنصرًا أولًا'); return; }
  const r = selected.getAttribute('rotation') || {x:0,y:0,z:0};
  tweenRotationY(selected, 0, 0); // no-op just to keep timing
  const toX = r.x + 90;
  const from = r.x;
  animate(220, p=>{
    selected.setAttribute('rotation', {x:lerp(from,toX,p), y:r.y, z:r.z});
  });
}

let moveObjInterval;

document.querySelectorAll('#controls button').forEach(btn=>{
  const act = btn.dataset.act;
  const start = ()=> {
    const step = stepVal();
    if(['up','down','left','right','zoomIn','zoomOut','rotL','rotR','tilt','grow','shrink'].includes(act) && !selected){
      msg('اختر عنصرًا أولًا'); return;
    }
    moveObjInterval = setInterval(()=>{
      if(act==='up')   tweenDeltaPosition(selected, 0, +step, 0, 100);
      if(act==='down') tweenDeltaPosition(selected, 0, -step, 0, 100);
      if(act==='left') tweenDeltaPosition(selected, -step, 0, 0, 100);
      if(act==='right')tweenDeltaPosition(selected, +step, 0, 0, 100);
      if(act==='zoomIn')  zoomSelected(-step);
      if(act==='zoomOut') zoomSelected(+step);
      if(act==='rotL') rotateSelected(-10);
      if(act==='rotR') rotateSelected(+10);
      if(act==='tilt') tiltSelected();
      if(act==='grow') tweenScaleFactor(selected, 1.02, 100);
      if(act==='shrink') tweenScaleFactor(selected, 0.98, 100);
    }, 60);
  };
  const stop = ()=> clearInterval(moveObjInterval);
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
  btn.addEventListener('touchstart', e=>{ e.preventDefault(); start(); });
  btn.addEventListener('touchend', stop);
});

/* إنشاء الملاحظة */
function createNoteAt(point, text) {
  const marker = document.createElement('a-entity');
  marker.classList.add('noteMarker','clickable');
  marker.setAttribute('position', `${point.x} ${Math.max(0.05,point.y)} ${point.z}`);
  marker.setAttribute('data-note', text || '');

  const dot = document.createElement('a-sphere');
  dot.setAttribute('radius','0.09');
  dot.setAttribute('material','color:#d4af37; emissive:#b78f2a; emissiveIntensity:0.5; metalness:0.4; roughness:0.3');
  dot.classList.add('clickable');
  marker.appendChild(dot);

  // لوحة الملاحظة
  const noteBox = document.createElement('a-entity');
  noteBox.setAttribute('visible','false');
  noteBox.setAttribute('position','0 1.0 0');

  const bg = document.createElement('a-plane');
  bg.setAttribute('width','3.2');
  bg.setAttribute('height','1.6');
  bg.setAttribute('material','color:#0a0c0f; opacity:0.88; side:double; metalness:0.2; roughness:0.4; emissive:#d4af37; emissiveIntensity:0.15');
  noteBox.appendChild(bg);

  const txt = document.createElement('a-entity');
  txt.setAttribute('text', `value:${text}; color:#fff; align:center; wrapCount:40; width:3;`);
  txt.setAttribute('position','0 0 0.02');
  noteBox.appendChild(txt);

  // أزرار التعديل والحذف والإغلاق
  const btnEdit = document.createElement('a-entity');
  btnEdit.setAttribute('text','value:✏️; color:#d4af37; align:left; width:1;');
  btnEdit.setAttribute('position','-1.3 0.6 0.02');
  btnEdit.classList.add('clickable');
  noteBox.appendChild(btnEdit);

  const btnDelete = document.createElement('a-entity');
  btnDelete.setAttribute('text','value:🗑️; color:#d4af37; align:center; width:1;');
  btnDelete.setAttribute('position','0 0.6 0.02');
  btnDelete.classList.add('clickable');
  noteBox.appendChild(btnDelete);

  const btnClose = document.createElement('a-entity');
  btnClose.setAttribute('text','value:✖️; color:#d4af37; align:right; width:1;');
  btnClose.setAttribute('position','1.3 0.6 0.02');
  btnClose.classList.add('clickable');
  noteBox.appendChild(btnClose);

  marker.appendChild(noteBox);
  marker._label = noteBox;
  marker._text = txt;

  // التفاعل
  dot.addEventListener('click', e => { e.stopPropagation(); toggleNote(); });
  btnClose.addEventListener('click', e => { e.stopPropagation(); noteBox.setAttribute('visible','false'); });
  btnDelete.addEventListener('click', e => {
    e.stopPropagation();
    marker.remove();
    saveNotes();
  });
  btnEdit.addEventListener('click', e => {
    e.stopPropagation();
    const newText = prompt('📝 عدّل الملاحظة:', marker.getAttribute('data-note') || '');
    if(newText !== null){
      marker.setAttribute('data-note', newText);
      txt.setAttribute('text', `value:${newText}; color:#fff; align:center; wrapCount:40; width:3;`);
      saveNotes();
    }
  });

  function toggleNote(){ const vis = noteBox.getAttribute('visible'); noteBox.setAttribute('visible', !vis); }

  scene.appendChild(marker);
  return marker;
}

let timeLeft=0, timer=null, score=0;
function fmt(t){ const m=String(Math.floor(t/60)).padStart(2,'0'); const s=String(t%60).padStart(2,'0'); return `${m}:${s}`; }
function endTimer(resetOnly=false){ if(timer){ clearInterval(timer); timer=null; } if(resetOnly){ timeLeft=0; timeEl.textContent='--:--'; statusEl.textContent='جاهز'; return; } statusEl.textContent='انتهى الوقت'; }
function animateNumber(el, from, to, dur=350){ const start=performance.now(); function step(now){ const p=Math.min(1,(now-start)/dur); const val = Math.round(from + (to-from)*p); el.textContent = String(val); if(p<1) requestAnimationFrame(step); } requestAnimationFrame(step); }
function addScore(delta){ const prev=score; score = Math.max(0, score + delta); animateNumber(scoreEl, prev, score); }
const durInp = document.getElementById('duration');
document.getElementById('btnGameStart').onclick = ()=>{
  timeLeft = parseInt(durInp.value)||120;
  if(timer) clearInterval(timer);
  timeEl.textContent = fmt(timeLeft);
  statusEl.textContent='الاختبار قيد التنفيذ';
  placed.forEach(p=>{ if(p.el) p.el.setAttribute('data-scored','no'); });
  timer = setInterval(()=>{ timeLeft--; timeEl.textContent=fmt(timeLeft); if(timeLeft<=0){ endTimer(); msg('⏱️ انتهى الوقت'); } },1000);
};
document.getElementById('btnGameStop').onclick = ()=>{ endTimer(); msg('تم الإيقاف'); };
document.getElementById('btnGameFinalize').onclick = ()=>{ msg(`تم الاعتماد — نقاطك: ${score}`); };

  halo.setAttribute('material',`color:${color}; opacity:0.9; transparent:true`);

}

  const ent = findAncestor(el, e => e.classList && e.classList.contains('placed'));

    if(rec) selectById(rec.id);

  const target = findAncestor(el, e => e.classList && e.classList.contains('placed'));
  if(target){
    const valid = target.getAttribute('data-valid');
    const scored = target.getAttribute('data-scored');

    // منع تكرار احتساب النقاط لنفس العنصر
    if(scored === 'yes') return;

    if(valid === 'true'){ 
      addScore(10); 
      flashHalo(target, '#39d98a'); 
      target.setAttribute('data-scored', 'yes'); 
    }
    else if(valid === 'false'){ 
      addScore(-5); 
      flashHalo(target, '#ff5c5c'); 
      target.setAttribute('data-scored', 'yes'); 
    }
  }
});

    const isSidebarVisible = !sidebar.classList.contains('hidden');

    if (isSidebarVisible) {

      if (isMobile) {
        // في الجوال: حركة بسيطة يسار بعد القائمة
        cameraControls.style.transform = 'translateX(-80px)';
      } else {
        // في اللابتوب: حركة أكبر يسار بعد القائمة
        cameraControls.style.transform = 'translateX(-290px)';
      }
    } else {
      // لما تُغلق القائمة ترجع لوضعها الطبيعي حسب نوع الجهاز
      cameraControls.style.transition = 'transform 0.4s ease';
      if (isMobile) {
        cameraControls.style.transform = 'translateX(-50%)'; // ترجع للمنتصف
      } else {

      }
    }
  });

  observer.observe(sidebar, { attributes: true, attributeFilter: ['class'] });
});

</script>

<script>
AFRAME.registerComponent('evidence-select', {
  init: function () {
    const el = this.el;

    // نجعل العنصر فعلياً قابل للكشف بالنقر حتى لو كان مسطح
    if (!el.hasAttribute('geometry')) {
      el.setAttribute('geometry', 'primitive: plane; width: 0.8; height: 0.8;');
      el.setAttribute('material', 'opacity: 0; transparent: true;');
    }

    el.addEventListener('click', () => {
  if (!window.missionStarted) return;

  const plane = el.querySelector('a-plane') || el;
  const mat = plane.getAttribute('material') || {};
  const isGreen = mat.color === '#39d98a';
  const newColor = isGreen ? '#ffffff' : '#39d98a';
  const newEmissive = isGreen ? 'none' : '#39d98a';

  plane.setAttribute('material', {
    color: newColor,
    emissive: newEmissive,
    emissiveIntensity: isGreen ? 0 : 0.6,
    transparent: true,
    opacity: 1
  });

  // 🟢 استدعاء نظام النقاط والـHUD الأصلي
  el.emit('evidencecollected', { id: el.id });

  console.log(isGreen ? '🔁 ألغيت اختيار الدليل' : '✅ تم اختيار الدليل');
});

  }
});
</script>

<script>
// === جويستك تحريك العنصر المختار (أعلى/أسفل/يمين/يسار) ===
(function(){
  const joy  = document.getElementById('objJoy');
  const knob = document.getElementById('objJoyKnob');
  if (!joy || !knob) return; // لو ما فيه دائرة لا تسوي شيء

  let active = false;
  let baseRect = null;
  let maxR = 32;
  let joyVec = { x: 0, y: 0 };

  // دالة تجيب العنصر المختار بنفس طريقة الأزرار
  function getSelectedEntity() {
    // الأولوية للـ window.selected اللي عرّفته سكربتاتك الأصلية
    if (window.selected) return window.selected;

    // لو مو موجود، جرّب تشوف القائمة
    const list = document.getElementById('placedList');
    if (list && list.value) {
      const optId = list.value;
      const ent = document.getElementById(optId);
      if (ent) {
        window.selected = ent; // خزّنه عشان المرات الجاية
        return ent;
      }
    }
    return null;
  }

  function start(e){
    const sel = getSelectedEntity();
    if (!sel) {
      if (typeof msg === "function") msg("اختر عنصرًا أولاً");
      return;
    }
    active = true;
    baseRect = joy.getBoundingClientRect();
    maxR = Math.min(baseRect.width, baseRect.height) * 0.38;
    update(e);
  }

  function stop(){
    active = false;
    joyVec.x = 0;
    joyVec.y = 0;
    knob.style.transform = "translate(0,0)";
  }

  function update(e){
    const t = (e.touches && e.touches[0]) || e;
    const cx = baseRect.left + baseRect.width / 2;
    const cy = baseRect.top  + baseRect.height / 2;
    const dx = t.clientX - cx;
    const dy = t.clientY - cy;
    const dist = Math.hypot(dx, dy);
    const r = Math.min(dist, maxR);
    const nx = (r === 0) ? 0 : (dx / dist) * r;
    const ny = (r === 0) ? 0 : (dy / dist) * r;

    knob.style.transform = `translate(${nx}px,${ny}px)`;
    // 🧮 نحولها -1..1 (عكس الاتجاه الأفقي)
joyVec.x = -nx / maxR;   // ← عكس حركة اليمين/اليسار
joyVec.y = ny / maxR;    // فوق/تحت تبقى كما هي

  }

  // حلقة التحريك
  function tick(){
    if (active) {
      const sel = getSelectedEntity();
      if (sel) {
        const step = (typeof window.stepVal === "function") ? window.stepVal() : 0.1;

const moveX = -joyVec.x * step; // ← عكس الاتجاه ليصبح السحب لليمين = تحرك يمين
        const moveY = -joyVec.y * step;     // عكسناه لأن السحب لتحت = نزول

        if (typeof window.tweenDeltaPosition === "function") {
          window.tweenDeltaPosition(sel, moveX, moveY, 0, 80);
        } else if (sel.object3D) {
          // احتياط لو ما لقينا الدالة
          sel.object3D.position.x += moveX;
          sel.object3D.position.y += moveY;
        }
      }
    }
    requestAnimationFrame(tick);
  }
  tick();

  // الأحداث
  joy.addEventListener("pointerdown", e => {
    joy.setPointerCapture(e.pointerId);
    start(e);
  });
  window.addEventListener("pointermove", e => { if (active) update(e); });
  window.addEventListener("pointerup",   () => { if (active) stop();    });
  window.addEventListener("pointercancel",() => { if (active) stop();   });

})();
</script>
