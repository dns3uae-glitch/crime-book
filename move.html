<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Royal CrimeBook — Calibration Pro (Long-Press + Tilt)</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
:root{
  --gold:#FFD54A; --gold2:#caa63b;
  --dark:#0A0F14; --panel:rgba(18,22,28,.88); --line:rgba(255,255,255,.12);
}
html,body{height:100%;margin:0;background:var(--dark);font-family:"Tajawal",system-ui,Arial;color:#fff;overflow:hidden}
a-scene{width:calc(100% - 420px);height:100vh;float:left}
#sidebar{
  position:fixed; right:0; top:0; width:420px; height:100vh;
  background:var(--panel); backdrop-filter:blur(10px);
  border-left:1px solid var(--line); box-shadow:-8px 0 32px rgba(0,0,0,.35);
  display:flex; flex-direction:column; gap:14px; padding:14px 16px; box-sizing:border-box; overflow-y:auto;
}
.section{border:1px solid var(--line); border-radius:14px; padding:12px; background:rgba(255,255,255,.05)}
.section h3{margin:0 0 8px; font-size:16px; color:var(--gold)}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
button{
  background:linear-gradient(90deg,var(--gold),var(--gold2)); color:#000; border:none; border-radius:10px;
  font-weight:800; cursor:pointer; padding:8px 12px; box-shadow:0 6px 18px rgba(255,213,74,.18)
}
button.mini{background:rgba(255,255,255,.08); color:#fff; border:1px solid var(--line); box-shadow:none}
button:disabled{opacity:.55; cursor:not-allowed}
select,input{
  background:#0d131a; color:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 8px
}
.badge{font-size:12px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--line)}
.coord{font-family:monospace; font-size:12px; background:rgba(255,255,255,.06); padding:6px 8px; border-radius:8px}
#evidenceList{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.ev-item{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.04)}
.ev-left{display:flex; align-items:center; gap:10px; min-width:0}
.ev-name{cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px}
.ev-right .mini{padding:6px 8px}
#selectedList{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; max-height:180px; overflow:auto}
#selectedList li{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 8px; background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:8px}
.selectedEnt{outline:2px solid rgba(57,217,138,.8)}
@media(max-width:900px){
  a-scene{width:100%}
  #sidebar{position:absolute; width:100%; height:auto; bottom:0; top:auto; max-height:54vh}
}
</style>
</head>
<body>

<!-- 🎬 3D SCENE -->
<a-scene embedded background="color:#8aa3c3">
  <a-entity light="type:ambient;intensity:0.9"></a-entity>
  <a-entity light="type:directional;color:#fff;intensity:0.6" position="0 10 10"></a-entity>

  <a-entity id="rig"
            position="0 1.6 3"
            movement-controls="fly:false;speed:0.15">
    <a-entity id="cam" camera look-controls wasd-controls="acceleration:30"></a-entity>
  </a-entity>

  <a-entity id="sceneRoot"></a-entity>
  <a-entity id="evidenceRoot"></a-entity>
  <a-entity id="ray" cursor="rayOrigin:mouse" raycaster="objects:.clickable"></a-entity>

  <!-- 🔹 مجسم متحرك من Fox -->
  <a-entity
    gltf-model="url(https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Fox/glTF-Binary/Fox.glb)"
    animation-mixer="clip: Survey; loop: repeat"
    position="0 0 -3"
    scale="0.03 0.03 0.03">
  </a-entity>

  <!-- 🔹 مجسم man2.glb الخاص بك -->
  <a-entity
    gltf-model="url(https://dns3uae-glitch.github.io/crime-book/assets/3d/man2.glb)"
    animation-mixer="clip: mixamo.com; loop: repeat"
    position="2 0 -3"
    scale="1 1 1">
  </a-entity>
</a-scene>

<!-- 🔧 SIDEBAR (اختصرناه هنا) -->
<div id="sidebar">
  <div class="section"><h3>🎯 المشهد</h3><p>تمت إضافة اختبار حركة Fox + man2</p></div>
</div>

<script>
console.log("✅ ملف move.html المعدل — جاهز للاختبار الكامل للأنميشن");
</script>
</body>
</html>
