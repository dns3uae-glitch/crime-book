<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم المدرّس — علم الاجتماع الشرطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --base:#FBF6EA; --panel:#FFF; --panel2:#F8EFD9; --line:#E3D3AE;
  --gold:#9A6A25; --gold2:#6E4515; --steel:#80643F; --ink:#4A2E10;
  --ok:#2F7D4F; --no:#B5392E; --amber:#96620F;
  --disp:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,sans-serif;
  --sh:0 2px 10px rgba(122,86,30,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
h1,h2,h3,h4{font-family:var(--disp);margin:0;line-height:1.3}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
input,textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;color:var(--ink);font-family:var(--body);font-size:14.5px}
textarea{resize:vertical;line-height:1.7}
.bar{position:sticky;top:0;z-index:40;background:rgba(251,246,234,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:11px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:800;font-size:16px}
.brand span{color:var(--steel);font-weight:500;font-size:12.5px}
.buildstamp{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:11px}
.navs{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.nv{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 15px;
  font-family:var(--disp);font-weight:700;font-size:13.5px;color:var(--steel)}
.nv[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 90px}
.btn{background:var(--gold);color:#fff;font-family:var(--disp);font-weight:800;padding:9px 18px;border-radius:9px;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.g:hover{border-color:var(--gold);color:var(--gold2);filter:none}
.btn.d{background:transparent;color:var(--no);border:1px solid var(--line)}
.btn.d:hover{border-color:var(--no)}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h3{font-size:16px;font-weight:800;margin-bottom:10px}
.hint{color:var(--steel);font-size:13px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
label{display:block;font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--steel);margin:0 0 4px}
.lay{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.lay{grid-template-columns:1fr}}
.wlist{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:8px;position:sticky;top:74px;max-height:78vh;overflow:auto}
.wli{width:100%;text-align:start;border-radius:9px;padding:8px 11px;font-size:14px;display:flex;gap:9px;align-items:center}
.wli:hover{background:var(--panel2)}
.wli[aria-current="true"]{background:var(--gold);color:#fff}
.wli b{font-family:var(--disp);font-weight:800;min-width:22px}
.wli small{margin-inline-start:auto;font-size:11px;opacity:.75}
.sub{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:10px;background:var(--panel2)}
.sub .row{margin-top:8px}
.tag{font-family:var(--disp);font-weight:700;font-size:11.5px;background:var(--line);color:var(--steel);border-radius:99px;padding:2px 10px}
.tag.ok{background:rgba(33,112,80,.14);color:var(--ok)}
.tag.no{background:rgba(181,49,42,.12);color:var(--no)}
.corr{display:flex;gap:7px;align-items:center;margin-top:6px}
.corr input[type=radio]{width:auto}


.lotbl{display:grid;gap:7px}
.lorow{display:grid;grid-template-columns:44px 1fr 140px 56px 104px 92px;gap:10px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:13.5px}
@media(max-width:880px){.lorow{grid-template-columns:44px 1fr 56px;row-gap:5px}
  .lorow .lobar,.lorow .lost,.lorow .lon{grid-column:2 / -1}}
.lorow.ok{border-inline-start:3px solid var(--ok)}
.lorow.no{border-inline-start:3px solid var(--no)}
.lorow.na{border-inline-start:3px solid var(--line);opacity:.72}
.loid{font-family:var(--disp);font-weight:900;color:var(--gold2);text-align:center}
.lotx{line-height:1.6}
.lobar{position:relative;height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:99px}
.lobar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.lorow.ok .lobar i{background:var(--ok)} .lorow.no .lobar i{background:var(--no)}
.lobar b{position:absolute;top:-4px;width:2px;height:15px;background:var(--ink);opacity:.55;border-radius:2px}
.lopct{font-family:var(--disp);font-weight:900;text-align:center}
.lost{font-family:var(--disp);font-weight:700;font-size:12px;text-align:center}
.lorow.ok .lost{color:var(--ok)} .lorow.no .lost{color:var(--no)} .lorow.na .lost{color:var(--steel)}
.lon{color:var(--steel);font-size:12px;text-align:center}

.dg{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--panel2)}
.dgh{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;
  border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:10px}
.dgt{font-family:var(--disp);font-weight:700;font-size:14px;line-height:1.5}
.dgp{font-family:var(--disp);font-weight:900;font-size:19px;color:var(--no);white-space:nowrap}
.dgp small{display:block;font-size:11px;color:var(--steel);font-weight:600}
.dgs{margin-top:12px;font-size:13.5px}
.dgs>b{font-family:var(--disp);color:var(--gold2);font-size:13.5px}
.dga{margin:7px 0 0;padding-inline-start:20px}
.dga li{margin-bottom:8px;line-height:1.75}


.autolo{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;
  font-size:13px;color:var(--steel);line-height:1.6}
.gencard{border-color:var(--gold);background:linear-gradient(180deg,#FCFAF4,var(--panel))}
.genstat{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sub.draft{border-inline-start:3px solid var(--amber)}

.drop2{margin-top:9px;border:2px dashed var(--line);border-radius:11px;padding:16px;text-align:center;
  color:var(--steel);font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s}
.drop2:hover,.drop2.over{border-color:var(--gold);background:#FCFAF5;color:var(--gold2)}
.drop2 b{color:var(--gold2)}
.rich-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.rich-ed{min-height:110px;max-height:420px;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.85}
.rich-ed:focus{outline:2px solid var(--gold);outline-offset:1px}
.rich-ed table{width:100%;border-collapse:collapse;margin:9px 0;font-size:13.5px}
.rich-ed th,.rich-ed td{border:1px solid var(--line);padding:6px 9px;text-align:start}
.rich-ed th{background:var(--panel2);font-weight:700}
.rich-ed img{max-width:100%;height:auto;border-radius:8px;margin:7px 0}
.rich-ed ul,.rich-ed ol{padding-inline-start:22px}
.rich-ed blockquote{border-inline-start:3px solid var(--gold);padding-inline-start:11px;margin:8px 0;color:var(--steel)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel)}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:center}
th{background:var(--panel2);font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--steel);cursor:pointer;white-space:nowrap}
th:hover{color:var(--gold2)}
td.s{text-align:start}
.tw{overflow:auto;border-radius:11px;border:1px solid var(--line);box-shadow:var(--sh)}
.pct{display:inline-block;min-width:44px;border-radius:99px;padding:1px 8px;font-weight:700;font-size:12.5px}
.p-hi{background:rgba(33,112,80,.15);color:var(--ok)}
.p-md{background:rgba(150,98,15,.15);color:var(--amber)}
.p-lo{background:rgba(181,49,42,.13);color:var(--no)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);padding:12px 14px}
.k b{display:block;font-family:var(--disp);font-weight:900;font-size:24px}
.k span{color:var(--steel);font-size:12.5px}
.bars{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:150px 1fr 52px;gap:9px;align-items:center;font-size:13px}
@media(max-width:640px){.brow{grid-template-columns:110px 1fr 46px}}
.btrack{height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.btrack i{display:block;height:100%;background:var(--gold);border-radius:99px}
.toast{position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--gold);
  color:#fff;font-family:var(--disp);font-weight:800;padding:10px 20px;border-radius:10px;z-index:80;font-size:14px;
  box-shadow:0 10px 30px rgba(26,35,48,.25)}
.drop{border:2px dashed var(--line);border-radius:13px;padding:26px;text-align:center;background:var(--panel);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--gold);background:#FCFAF5}
.code{width:100%;background:#1A2330;color:#E6EDF5;border-radius:10px;padding:13px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12px;direction:ltr;text-align:left;line-height:1.65;overflow:auto;max-height:340px;white-space:pre}
.warn{border-inline-start:3px solid var(--amber);background:#FDF8EE;border-radius:0 9px 9px 0;padding:11px 14px;font-size:13.5px;margin:10px 0}
.ok{border-inline-start:3px solid var(--ok);background:#F0F8F4;border-radius:0 9px 9px 0;padding:11px 14px;font-size:13.5px;margin:10px 0}
.err{border-inline-start:3px solid var(--no);background:#FDF2F1;border-radius:0 9px 9px 0;padding:11px 14px;font-size:13.5px;margin:10px 0}

/* ===== الوسائط ===== */
.mblock{border:1px dashed var(--line);border-radius:11px;padding:10px;background:var(--panel2)}
.mrow2{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px;margin-bottom:7px}
.mth{width:64px;height:48px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-size:22px;overflow:hidden}
.mth img{width:100%;height:100%;object-fit:cover}
.mkind{font-family:var(--disp);font-weight:700;font-size:13px;margin-bottom:3px}
.mkind small{color:var(--steel);font-weight:500;margin-inline-start:6px;direction:ltr;display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.mmid input{padding:5px 9px;font-size:13px}
.mact{display:flex;gap:5px}
.mtotal{font-size:12.5px;color:var(--steel);margin-top:6px}

/* ===== إصلاح الجوال: قائمة المحطات كانت لاصقة وتغطي حقول الكتابة ===== */
@media(max-width:900px){
  .bar{position:static}
  .bar-in{padding:9px 14px}
  .wrap{padding:14px 12px 90px}
  .wlist{position:static!important;top:auto!important;max-height:210px;overflow:auto;-webkit-overflow-scrolling:touch}
  .wlist .wli{padding:7px 10px;font-size:13.5px}
  .card{padding:14px}
  input,textarea,select{font-size:16px;-webkit-appearance:none;appearance:none;min-height:42px}
  select{-webkit-appearance:menulist;appearance:menulist}
  input[type=checkbox],input[type=radio]{min-height:0;-webkit-appearance:auto;appearance:auto}
  textarea{min-height:84px}
  .rich-ed{font-size:16px;min-height:130px}
  .btn{min-height:40px}
  .btn.sm{min-height:36px}
}
.rich-ed,textarea,input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.rich-ed{-webkit-user-modify:read-write}
.toast{pointer-events:none}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <div class="brand">لوحة تحكم المدرّس <span>· علم الاجتماع الشرطي</span> <span class="buildstamp">نسخة 2026-09-17</span></div>
  <div class="navs" id="navs"></div>
</div></div>

<main class="wrap">
  <section id="p-load"></section>
  <section id="p-edit" class="hidden"></section>
  <section id="p-set" class="hidden"></section>
  <section id="p-build" class="hidden"></section>
  <section id="p-exam" class="hidden"></section>
  <section id="p-book" class="hidden"></section>
</main>

<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};

let SRC="",W=[],CFG=null,RANKS=[],MEDALS=[],cw=0,page="load";
const PAGES=[["load","الملف"],["edit","المحتوى"],["set","الإعدادات"],["build","بناء ملف الطلبة"],["exam","الامتحانات والتصدير"]];

function nav(){
  $("#navs").innerHTML=PAGES.map(p=>`<button class="nv" data-p="${p[0]}" aria-selected="${page===p[0]}" ${(!W.length&&p[0]!=="load")?"disabled":""}>${p[1]}</button>`).join("");
  $$("#navs .nv").forEach(b=>b.onclick=()=>{page=b.dataset.p;nav();paint()});
}
function paint(){
  PAGES.forEach(p=>$("#p-"+p[0]).classList.toggle("hidden",p[0]!==page));
  ({load:vLoad,edit:vEdit,set:vSet,build:vBuild,exam:vExam,book:vBook})[page]();
}

/* ================= 1) تحميل ملف الطلبة ================= */
function vLoad(){
  $("#p-load").innerHTML=`
   <div class="card"><h3>ابدأ بتحميل ملف الطلبة</h3>
    <p class="hint">اختر الملف <code>police_sociology_field_course.html</code>. تقرأ اللوحة محتواه ثم تتيح لك تعديل كل شيء وإعادة بنائه.</p>
    <div class="drop" id="drop">
      <div style="font-family:var(--disp);font-weight:800;font-size:16px">اسحب الملف هنا أو اضغط للاختيار</div>
      <div style="color:var(--steel);font-size:13px;margin-top:5px">ملف HTML واحد</div>
      <input type="file" id="fi" accept=".html,.htm" style="display:none">
    </div>
    <div id="lmsg"></div></div>
   ${SRC?`<div class="card"><h3>أو ابدأ مساقاً جديداً من الصفر</h3>
    <p class="hint">يمسح المحتوى الحالي ويبني هيكلاً فارغاً بعدد المحطات الذي تختاره — لمساق آخر أو لمحاضر آخر.
      احفظ نسخة JSON من مساقك الحالي أولاً إن أردت الرجوع إليه.</p>
    <div class="grid3">
      <div><label>اسم المساق</label><input id="nc-name" placeholder="مثال: مبادئ القانون الجنائي"></div>
      <div><label>عدد المحطات الأسبوعية</label><input id="nc-n" type="number" min="1" max="30" value="16"></div>
      <div><label>عدد الأسئلة في كل محطة</label><input id="nc-q" type="number" min="1" max="30" value="10"></div>
    </div>
    <div class="row" style="margin-top:11px">
      <label style="display:flex;gap:7px;align-items:center;font-family:var(--body);font-weight:500;font-size:14px;color:var(--ink);margin:0">
        <input type="checkbox" id="nc-boss" checked style="width:auto"> إضافة نقطتَي تفتيش (المنتصف والختام)</label>
      <label style="display:flex;gap:7px;align-items:center;font-family:var(--body);font-weight:500;font-size:14px;color:var(--ink);margin:0">
        <input type="checkbox" id="nc-demo" checked style="width:auto"> محطة نموذجية تعرض أنماط الأسئلة العشرة</label>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn" id="nc-go">إنشاء الهيكل الجديد</button></div></div>`:""}
   ${W.length?`<div class="card"><h3>الملف المحمّل</h3>
     <div class="kpi">
      <div class="k"><b>${W.length}</b><span>محطة</span></div>
      <div class="k"><b>${W.reduce((a,w)=>a+w.q.length,0)}</b><span>سؤالاً</span></div>
      <div class="k"><b>${W.reduce((a,w)=>a+w.cards.length,0)}</b><span>بطاقة</span></div>
      <div class="k"><b>${W.reduce((a,w)=>a+w.ch.length,0)}</b><span>تحدياً</span></div>
      <div class="k"><b>${W.reduce((a,w)=>a+w.file.length,0)}</b><span>قسماً</span></div></div>
     <div class="ok">جاهز. انتقل إلى «المحتوى» للتعديل، ثم «بناء ملف الطلبة» للتصدير.</div></div>`:""}`;
  const d=$("#drop"),fi=$("#fi");
  d.onclick=()=>fi.click();
  d.ondragover=e=>{e.preventDefault();d.classList.add("over")};
  d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over");if(e.dataTransfer.files[0])read(e.dataTransfer.files[0])};
  fi.onchange=()=>{if(fi.files[0])read(fi.files[0])};
  const go=$("#nc-go");
  if(go)go.onclick=()=>{
    const nm=($("#nc-name").value||"").trim();
    if(!nm)return toast("اكتب اسم المساق أولاً");
    const n=Math.max(1,Math.min(30,+$("#nc-n").value||16));
    const q=Math.max(1,Math.min(30,+$("#nc-q").value||10));
    if(!confirm("سيُمسح المحتوى الحالي ويُبنى هيكل جديد لمساق «"+nm+"». هل حفظت نسخة JSON من مساقك الحالي؟"))return;
    newCourse(nm,n,q,$("#nc-boss").checked,$("#nc-demo").checked);
    toast("جاهز — انتقل إلى «المحتوى»");page="edit";nav();paint();
  };
}
function read(f){
  const r=new FileReader();
  r.onload=()=>{try{parse(r.result);toast("حُمّل الملف بنجاح");page="edit";nav();paint()}
    catch(e){$("#lmsg").innerHTML=`<div class="err"><b>تعذّرت القراءة.</b> ${esc(e.message)}<br>تأكد أنك اخترت ملف الدورة الميدانية نفسه دون تعديل يدوي عليه.</div>`}};
  r.readAsText(f,"utf-8");
}
function parse(txt){
  const a=txt.indexOf("/*__PSA_DATA_START__*/"),b=txt.indexOf("/*__PSA_DATA_END__*/");
  if(a<0||b<0)throw new Error("لم يُعثر على كتلة البيانات داخل الملف.");
  const block=txt.slice(a+22,b);
  const o=new Function(block+"\nreturn {CFG:CFG,W:W,RANKS:RANKS,MEDALS:MEDALS};")();
  if(!Array.isArray(o.W)||!o.W.length)throw new Error("كتلة البيانات فارغة.");
  SRC=txt;W=o.W;CFG=o.CFG;RANKS=o.RANKS;MEDALS=o.MEDALS;cw=0;
}


/* ===== منظّف المحتوى الملصوق ===== */
const OKTAG=["P","BR","B","STRONG","I","EM","U","S","SUP","SUB","UL","OL","LI","H3","H4","H5",
  "TABLE","THEAD","TBODY","TFOOT","TR","TH","TD","BLOCKQUOTE","CODE","PRE","SPAN","DIV","IMG","A","HR"];
function clean(node){
  [...node.childNodes].forEach(n=>{
    if(n.nodeType===8){n.remove();return}
    if(n.nodeType!==1)return;
    if(!OKTAG.includes(n.tagName)){
      const f=n.ownerDocument.createDocumentFragment();
      while(n.firstChild)f.appendChild(n.firstChild);
      n.replaceWith(f);return;
    }
    [...n.attributes].forEach(a=>{
      const k=a.name.toLowerCase();
      const keep=(n.tagName==="IMG"&&k==="src")||(n.tagName==="A"&&k==="href")
        ||(["TD","TH"].includes(n.tagName)&&["colspan","rowspan"].includes(k));
      if(!keep)n.removeAttribute(a.name);
    });
    if(n.tagName==="IMG"&&!/^data:image\//i.test(n.getAttribute("src")||"")){n.remove();return}
    if(n.tagName==="A"&&!/^https?:\/\//i.test(n.getAttribute("href")||""))n.removeAttribute("href");
    if(n.tagName==="DIV"){const p=n.ownerDocument.createElement("p");p.innerHTML=n.innerHTML;n.replaceWith(p);clean(p);return}
    clean(n);
  });
}
function sanitize(html){
  /* طبقة أولى: تنظيف نصي قبل التحليل */
  let s=String(html)
    .replace(/<(script|style|meta|link|iframe|object|embed|form)[\s\S]*?<\/\1>/gi,"")
    .replace(/<(script|style|meta|link|iframe|object|embed|form|input|button)[^>]*>/gi,"")
    .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,"")
    .replace(/javascript:/gi,"");
  /* طبقة ثانية: تحليل خامل لا يشغّل سكربتاً ولا يحمّل صورة */
  const doc=new DOMParser().parseFromString("<div id='psaroot'>"+s+"</div>","text/html");
  const d=doc.getElementById("psaroot");
  clean(d);
  return d.innerHTML.replace(/(<p>(\s|&nbsp;|<br\s*\/?>)*<\/p>)/gi,"").trim();
}
function tsvToTable(txt){
  const rows=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim()!=="").map(l=>l.split("\t"));
  if(rows.length<2||rows[0].length<2)return null;
  const esc2=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  return "<table><thead><tr>"+rows[0].map(c=>"<th>"+esc2(c)+"</th>").join("")+"</tr></thead><tbody>"+
    rows.slice(1).map(r=>"<tr>"+r.map(c=>"<td>"+esc2(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
}


/* ===== الوسائط: صور وفيديو ===== */
const MAXVID=25*1024*1024, MREG={};
function fileToData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error("تعذّرت قراءة الملف"));r.onload=()=>res(r.result);r.readAsDataURL(file)})}
function fileToImg(file,maxW){
  maxW=maxW||1400;
  return fileToData(file).then(src=>new Promise((res,rej)=>{
    const im=new Image();
    im.onerror=()=>rej(new Error("صورة غير صالحة"));
    im.onload=()=>{
      const k=Math.min(1,maxW/Math.max(im.width,im.height));
      const w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      res(c.toDataURL("image/jpeg",.82));
    };
    im.src=src;
  }));
}
const mediaKB=m=>Math.round(((m.src||"").length*.75)/1024);
function mediaTotalKB(){
  let t=0;const add=m=>{if(m&&m.k!=="url")t+=mediaKB(m)};
  W.forEach(w=>{(w.media||[]).forEach(add);(w.file||[]).forEach(s=>(s.media||[]).forEach(add));
    (w.cards||[]).forEach(c=>add(c[2]));(w.q||[]).forEach(q=>add(q.media))});
  return t;
}
function mediaCount(){
  let n=0;
  W.forEach(w=>{n+=(w.media||[]).length;(w.file||[]).forEach(s=>n+=(s.media||[]).length);
    (w.cards||[]).forEach(c=>{if(c[2])n++});(w.q||[]).forEach(q=>{if(q.media)n++})});
  return n;
}
function mediaBlock(key,acc,single){
  MREG[key]={acc:acc,single:!!single};
  const L=acc.get();
  const rows=L.map((m,i)=>`<div class="mrow2"><div class="mth">${m.k==="img"?`<img src="${esc(m.src)}" alt="">`:(m.k==="vid"?"🎞":"🔗")}</div>
    <div class="mmid"><div class="mkind">${m.k==="img"?"صورة":(m.k==="vid"?"فيديو مرفوع":"رابط فيديو")}<small>${m.k==="url"?esc(m.src):mediaKB(m)+" ك.ب"}</small></div>
      <input data-mcap="${key}|${i}" placeholder="وصف يظهر تحت الوسيط (اختياري)" value="${esc(m.cap||"")}"></div>
    <div class="mact">${single?"":`<button class="btn g sm" data-mup="${key}|${i}">▲</button><button class="btn g sm" data-mdn="${key}|${i}">▼</button>`}
      <button class="btn d sm" data-mdel="${key}|${i}">حذف</button></div></div>`).join("");
  const full=single&&L.length>=1;
  return `<div class="mblock" data-mk="${key}"><div class="mlist">${rows||'<p class="hint" style="margin:0 0 4px">لا توجد وسائط بعد.</p>'}</div>
    ${full?"":`<div class="row" style="margin-top:8px">
      <button class="btn g sm" data-madd="${key}|img">+ صورة</button>
      <button class="btn g sm" data-madd="${key}|vid">+ فيديو من جهازك</button>
      <button class="btn g sm" data-madd="${key}|url">+ رابط فيديو</button></div>
      <input type="file" data-mf="${key}" style="display:none">`}</div>`;
}
function mediaRefresh(key){
  const el=document.querySelector(`[data-mk="${key}"]`),r=MREG[key];
  if(el&&r)el.outerHTML=mediaBlock(key,r.acc,r.single);
}
function validVideoUrl(u){
  if(!/^https:\/\//i.test(u))return false;
  return /(youtu\.be\/|youtube\.com\/(watch|embed|shorts)|vimeo\.com\/)/i.test(u)||/\.(mp4|webm|ogg)(\?[^\s]*)?$/i.test(u);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-madd],[data-mdel],[data-mup],[data-mdn]");if(!t)return;
  if(t.dataset.madd){
    const [key,kind]=t.dataset.madd.split("|"),r=MREG[key];if(!r)return;
    if(kind==="url"){
      const u=(prompt("الصق رابط الفيديو (https) من YouTube أو Vimeo، أو رابط مباشر لملف mp4 أو webm:","")||"").trim();
      if(!u)return;
      if(!validVideoUrl(u))return toast("الرابط غير مدعوم. استخدم https مع YouTube أو Vimeo أو ملف mp4/webm");
      const L=r.acc.get().slice();L.push({k:"url",src:u,cap:""});r.acc.set(L);mediaRefresh(key);toast("أُضيف رابط الفيديو");return;
    }
    const f=document.querySelector(`[data-mf="${key}"]`);if(!f)return;
    f.dataset.kind=kind;f.accept=kind==="img"?"image/*":"video/mp4,video/webm,video/ogg";
    f.multiple=(!r.single&&kind==="img");f.value="";f.click();return;
  }
  const [key,i0]=(t.dataset.mdel||t.dataset.mup||t.dataset.mdn).split("|"),i=+i0,r=MREG[key];if(!r)return;
  const L=r.acc.get().slice();
  if(t.dataset.mdel){if(!confirm("حذف هذا الوسيط؟"))return;L.splice(i,1)}
  else if(t.dataset.mup){if(!i)return;[L[i-1],L[i]]=[L[i],L[i-1]]}
  else{if(i>=L.length-1)return;[L[i+1],L[i]]=[L[i],L[i+1]]}
  r.acc.set(L);mediaRefresh(key);
});
document.addEventListener("change",async e=>{
  const f=e.target;if(!f||!f.dataset||!f.dataset.mf)return;
  const key=f.dataset.mf,r=MREG[key],kind=f.dataset.kind;if(!r||!f.files.length)return;
  const L=r.acc.get().slice();
  try{
    for(const file of [...f.files]){
      if(r.single&&L.length)break;
      if(kind==="img"){L.push({k:"img",src:await fileToImg(file),cap:""})}
      else{
        if(file.size>MAXVID){toast("حجم الفيديو أكبر من 25 ميغابايت. استخدم رابطاً أو اضغط الفيديو أولاً");continue}
        L.push({k:"vid",src:await fileToData(file),cap:""});
      }
    }
    r.acc.set(L);mediaRefresh(key);
    const kb=mediaTotalKB();toast("أُضيف الوسيط"+(kb>40960?" — تنبيه: حجم الوسائط الكلي كبير وقد يثقل ملف الطلبة":""));
  }catch(err){toast(err.message||"تعذّرت إضافة الوسيط")}
});
document.addEventListener("input",e=>{
  const c=e.target&&e.target.dataset&&e.target.dataset.mcap;if(!c)return;
  const [key,i]=c.split("|"),r=MREG[key];if(!r)return;
  const L=r.acc.get();if(L[+i]){L[+i].cap=e.target.value}
});
const stAcc=w=>({get:()=>w.media||[],set:a=>{a.length?w.media=a:delete w.media}});
const secAcc=s=>({get:()=>s.media||[],set:a=>{a.length?s.media=a:delete s.media}});
const cardAcc=c=>({get:()=>c[2]?[c[2]]:[],set:a=>{if(a.length)c[2]=a[0];else c.length=Math.min(c.length,2)}});
const qAcc=q=>({get:()=>q.media?[q.media]:[],set:a=>{a.length?q.media=a[0]:delete q.media}});

/* ===== مولّد الأسئلة والبطاقات وورشة التطبيق من محتوى المحطة ===== */
function stripTags(s){return String(s||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim()}
function facts(w){
  const kv=[],lists=[],bolds=[],sents=[];
  (w.file||[]).forEach(s=>{
    if(s.intro)return;
    const slo=s.lo||"";
    (s.kv||[]).forEach(p=>{
      const k=stripTags(p[0]),v=stripTags(p[1]);
      if(k.length>=3&&k.length<=70&&v.length>=12&&v.length<=220)kv.push({k,v,h:stripTags(s.h),lo:slo});
    });
    if(s.l&&s.l.length>=3){
      const items=s.l.map(stripTags).filter(x=>x.length>=4&&x.length<=110);
      if(items.length>=3)lists.push({h:stripTags(s.h),items,lo:slo});
    }
    (s.p||[]).forEach(p=>{
      const raw=String(p);
      (raw.match(/<b>(.*?)<\/b>/g)||[]).forEach(m=>{
        const t=stripTags(m);
        if(t.length>=3&&t.length<=50)bolds.push({t,h:stripTags(s.h),lo:slo});
      });
      stripTags(raw).split(/[.؟!]\s+/).forEach(x=>{
        const t=x.trim();
        if(t.length>=45&&t.length<=200)sents.push({t,h:stripTags(s.h),lo:slo});
      });
    });
  });
  const cards=(w.cards||[]).map(c=>({k:stripTags(c[0]),v:stripTags(c[1]),lo:""}))
    .filter(c=>c.k.length>=3&&c.v.length>=10);
  return {kv,lists,bolds,sents,cards};
}
function pick(arr,n,exclude){
  const pool=arr.filter(x=>!exclude||!exclude.includes(x));
  const out=[];const c=pool.slice();
  while(out.length<n&&c.length){out.push(c.splice(Math.floor(Math.random()*c.length),1)[0])}
  return out;
}
function uniqPush(list,q,seen){
  const key=stripTags(q.q).slice(0,60);
  if(seen[key])return false;
  seen[key]=1;list.push(q);return true;
}
function dominantLo(w){
  const c={};
  (w.file||[]).forEach(s=>{if(!s.intro&&s.lo)c[s.lo]=(c[s.lo]||0)+1});
  const k=Object.keys(c).sort((a,b)=>c[b]-c[a]);
  return k.length?k[0]:"";
}
function cardLo(w,card,F){
  const nk=stripTags(card.k);
  /* هل المصطلح نفسه موجود في جدول قسم؟ */
  const hit=F.kv.find(x=>x.k===nk);
  if(hit&&hit.lo)return hit.lo;
  /* هل يرد داخل نص قسم؟ */
  let found="";
  (w.file||[]).forEach(s=>{
    if(found||s.intro||!s.lo)return;
    const blob=[(s.p||[]).join(" "),(s.l||[]).join(" "),
      (s.kv||[]).map(p=>p[0]+" "+p[1]).join(" "),s.html||""].join(" ");
    if(stripTags(blob).indexOf(nk)>-1)found=s.lo;
  });
  return found||dominantLo(w);
}
function genQuestions(w,type,count,lo,src){
  const F=facts(w);
  lo=lo||dominantLo(w);
  const pool=(src==="cards")?F.cards.map(c=>({k:c.k,v:c.v,h:"",lo:cardLo(w,c,F)}))
    :(src==="file")?F.kv
    :F.kv.concat(F.cards.map(c=>({k:c.k,v:c.v,h:"",lo:cardLo(w,c,F)})));
  const allV=pool.map(x=>x.v), allK=pool.map(x=>x.k);
  const out=[],seen={};
  const mk=(o,srcLo)=>Object.assign({draft:1},o,{lo:(srcLo||lo||undefined)});
  const makers={
    mcq(){
      pool.forEach(p=>{
        if(out.length>=count)return;
        const d=pick(allV,6,[p.v]).filter(x=>x!==p.v);
        const opts=[];
        [p.v].concat(d).forEach(x=>{if(opts.length<4&&opts.indexOf(x)<0)opts.push(x)});
        if(opts.length<4)return;
        uniqPush(out,mk({t:"mcq",q:"ما المقصود بـ«"+p.k+"»؟",o:opts,c:0,
          w:"«"+p.k+"»: "+p.v},p.lo),seen);
      });
      pool.forEach(p=>{
        if(out.length>=count)return;
        const d=pick(allK,6,[p.k]).filter(x=>x!==p.k);
        const opts=[];
        [p.k].concat(d).forEach(x=>{if(opts.length<4&&opts.indexOf(x)<0)opts.push(x)});
        if(opts.length<4)return;
        uniqPush(out,mk({t:"mcq",q:"أيُّ المصطلحات التالية ينطبق عليه هذا الوصف: "+p.v,
          o:opts,c:0,w:"الوصف يخص «"+p.k+"»."},p.lo),seen);
      });
    },
    tf(){
      pool.forEach(p=>{
        if(out.length>=count)return;
        const wrong=Math.random()<0.5;
        const other=pick(allV,3,[p.v]).filter(x=>x!==p.v)[0];
        if(wrong&&!other)return;
        uniqPush(out,mk({t:"tf",
          q:"«"+p.k+"» يعني: "+(wrong?other:p.v),
          o:["صحيحة","خاطئة"],c:wrong?1:0,
          w:"التعريف الصحيح لـ«"+p.k+"»: "+p.v},p.lo),seen);
      });
    },
    short(){
      pool.forEach(p=>{
        if(out.length>=count)return;
        uniqPush(out,mk({t:"short",q:"اذكر المصطلح الذي يدل على: "+p.v,
          ans:[p.k],w:"الإجابة: «"+p.k+"»."},p.lo),seen);
      });
    },
    multi(){
      F.lists.forEach(L=>{
        if(out.length>=count)return;
        const others=F.lists.filter(x=>x!==L).flatMap(x=>x.items)
          .concat(F.kv.map(x=>x.k));
        const right=pick(L.items,Math.min(3,L.items.length-1));
        const wrong=pick(others,4,right).filter(x=>right.indexOf(x)<0);
        const uw=[];wrong.forEach(x=>{if(uw.length<2&&uw.indexOf(x)<0)uw.push(x)});
        if(right.length<2||uw.length<2)return;
        const opts=right.concat(uw);
        if(new Set(opts).size!==opts.length)return;
        const idx=opts.map((o,i)=>i).filter(i=>i<right.length);
        uniqPush(out,mk({t:"multi",q:"أيٌّ مما يلي من "+L.h+"؟",o:opts,c:idx,
          w:"الصحيح: "+right.join(" · ")},L.lo),seen);
      });
    },
    order(){
      F.lists.forEach(L=>{
        if(out.length>=count)return;
        const items=L.items.slice(0,Math.min(6,L.items.length));
        if(items.length<3)return;
        uniqPush(out,mk({t:"order",q:"رتّب ما يلي كما ورد في "+L.h,items:items,
          w:"الترتيب الصحيح: "+items.join(" ← ")},L.lo),seen);
      });
    },
    match(){
      for(let i=0;i<pool.length&&out.length<count;i+=4){
        const grp=pool.slice(i,i+4);
        if(grp.length<3)continue;
        const R=grp.map(p=>p.v), K=grp.map(p=>p.k);
        if(new Set(R).size!==R.length||new Set(K).size!==K.length)continue;
        uniqPush(out,mk({t:"match",q:"طابق كل مصطلح بما يقابله",
          pairs:grp.map(p=>[p.k,p.v]),
          w:"راجع دليل المحطة لهذه المحطة."},grp[0].lo),seen);
      }
    },
    cloze(){
      F.sents.forEach(s=>{
        if(out.length>=count)return;
        const b=F.bolds.find(x=>s.t.indexOf(x.t)>-1);
        if(!b)return;
        const d=pick(F.bolds.map(x=>x.t).concat(allK),5,[b.t]).filter(x=>x!==b.t);
        const opts=[];[b.t].concat(d).forEach(x=>{if(opts.length<3&&opts.indexOf(x)<0)opts.push(x)});
        if(opts.length<3)return;
        uniqPush(out,mk({t:"cloze",q:"أكمل الفراغ",
          text:s.t.replace(b.t,"{1}"),
          blanks:[{o:opts,c:0}],
          w:"الكلمة الصحيحة: «"+b.t+"»."},b.lo||s.lo),seen);
      });
    },
    cat(){
      for(let i=0;i+1<F.lists.length&&out.length<count;i+=2){
        const A=F.lists[i],B=F.lists[i+1];
        const a=A.items.slice(0,3),b=B.items.slice(0,3).filter(x=>a.indexOf(x)<0);
        if(a.length<2||b.length<2)continue;
        if(new Set(a.concat(b)).size!==a.length+b.length)continue;
        uniqPush(out,mk({t:"cat",q:"صنّف كل عنصر تحت فئته",
          cats:[{name:A.h,items:a},{name:B.h,items:b}],
          w:"راجع دليل المحطة لهذه المحطة."},A.lo||B.lo),seen);
      }
    },
    num(){
      F.lists.forEach(L=>{
        if(out.length>=count)return;
        uniqPush(out,mk({t:"num",q:"كم عدد العناصر التي وردت تحت «"+L.h+"»؟",
          val:L.items.length,tol:0,unit:"",
          w:"العدد الصحيح: "+L.items.length+"."},L.lo),seen);
      });
    }
  };
  if(type==="auto"){
    const order=["mcq","multi","match","order","tf","short","cloze","cat"];
    const target=count;
    let guard=0;
    while(out.length<target&&guard<60){
      const before=out.length;
      order.forEach(k=>{
        if(out.length>=target)return;
        const cur=out.length;
        const fn=makers[k];
        if(!fn)return;
        count=cur+1;
        fn();
        count=target;
      });
      if(out.length===before)break;
      guard++;
    }
  }else if(makers[type]){ makers[type]() }
  return out.slice(0,count);
}
function genCards(w,count){
  const F=facts(w);
  const have=(w.cards||[]).map(c=>stripTags(c[0]));
  const out=[];
  F.kv.forEach(p=>{
    if(out.length>=count)return;
    if(have.indexOf(p.k)>-1)return;
    if(out.some(c=>c[0]===p.k))return;
    out.push([p.k,p.v]);
  });
  if(out.length<count){
    F.bolds.forEach(b=>{
      if(out.length>=count)return;
      if(have.indexOf(b.t)>-1||out.some(c=>c[0]===b.t))return;
      const s=F.sents.find(x=>x.t.indexOf(b.t)>-1);
      if(s)out.push([b.t,s.t]);
    });
  }
  return out;
}
function genChallenges(w,count){
  const F=facts(w),out=[];
  F.lists.forEach(L=>{
    if(out.length>=count)return;
    const items=L.items.slice(0,Math.min(6,L.items.length));
    if(items.length>=3&&new Set(items).size===items.length)
      out.push({t:"order",title:"رتّب ما يلي كما ورد في "+L.h,items:items});
  });
  for(let i=0;i<F.kv.length&&out.length<count;i+=4){
    const grp=F.kv.slice(i,i+4);
    const R=grp.map(p=>p.v);
    if(grp.length>=3&&new Set(R).size===R.length)
      out.push({t:"match",title:"طابق كل مصطلح بما يقابله",pairs:grp.map(p=>[p.k,p.v])});
  }
  return out.slice(0,count);
}
function genReport(w){
  const F=facts(w);
  return {kv:F.kv.length,lists:F.lists.length,bolds:F.bolds.length,cards:F.cards.length,sents:F.sents.length};
}

const QTYPES=[["mcq","اختيار من متعدد"],["multi","اختيار متعدد الإجابات"],["tf","صح أو خطأ"],

function blankQ(t){

  if(t==="multi")return{...B,o:["الخيار الأول","الخيار الثاني","الخيار الثالث","الخيار الرابع"],c:[0,1]};
  if(t==="short")return{...B,ans:["الإجابة الصحيحة","بديل مقبول"]};
  if(t==="num")return{...B,val:0,tol:0,unit:""};
  if(t==="match")return{...B,q:"طابق كل عنصر بما يقابله",pairs:[["العنصر الأول","ما يقابل الأول"],["العنصر الثاني","ما يقابل الثاني"]]};
  if(t==="order")return{...B,q:"رتّب ما يلي",items:["الأول","الثاني","الثالث"]};
  if(t==="cloze")return{...B,q:"أكمل الفراغات",text:"الأمن مسؤولية {1}، وتقوم الشرطة المجتمعية على {2}.",
    blanks:[{o:["مشتركة","الشرطة وحدها"],c:0},{o:["الشراكة","الردع"],c:0}]};
  if(t==="cat")return{...B,q:"صنّف العناصر",cats:[{name:"الفئة الأولى",items:["عنصر أ","عنصر ب"]},{name:"الفئة الثانية",items:["عنصر ج"]}]};
  return{...B,q:"سؤال مفتوح",model:"الإجابة النموذجية التي تُعرض بعد التسليم."};
}

  if(t==="cat")return `<label style="margin-top:9px">الفئات — سطر لكل فئة بصيغة: اسم الفئة = عنصر، عنصر، عنصر</label>

    <div class="row" style="margin-top:12px"><button class="btn sm" id="s4">حفظ الحدود</button></div></div>`;
  $("#s1").onclick=()=>{CFG.course=$("#c-course").value;CFG.academy=$("#c-acad").value;CFG.teacher=$("#c-teacher").value;CFG.version=Math.max(1,Math.min(255,+$("#c-ver").value||1));

  $("#s2").onclick=()=>{CFG.submitUrl=$("#c-url").value.trim();toast(CFG.submitUrl?"حُفظ الرابط":"أُلغي الإرسال التلقائي")};
  $("#s4b").onclick=async()=>{
    const u=($("#c-url").value||"").trim();
    const box=$("#gs");
    if(!u)return box.innerHTML='<div class="err" style="margin-top:12px">الصق الرابط أولاً.</div>';
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u))
      return box.innerHTML=`<div class="err" style="margin-top:12px"><b>شكل الرابط غير صحيح.</b>
        يجب أن يبدأ بـ <code>https://script.google.com/macros/s/</code> وينتهي بـ <code>/exec</code>.
        ${/\/dev$/.test(u)?"<br>رابطك ينتهي بـ <code>/dev</code> — هذا رابط التطوير ولا يعمل إلا لك. انسخ رابط النشر.":""}</div>`;
    box.innerHTML='<div class="warn" style="margin-top:12px">جارٍ الاختبار…</div>';
    try{
      const r=await fetch(u,{method:"GET",redirect:"follow"});
      const t=await r.text();
      if(t.indexOf("PSA-OK")>-1){
        box.innerHTML=`<div class="ok" style="margin-top:12px"><b>الاتصال سليم.</b> ${esc(t.slice(0,160))}
          <br>افتح الجدول الآن — ستجد صف «اختبار الاتصال». امسحه بعد التأكد.
          <br><b>تبقّى أمر واحد:</b> ابنِ ملف الطلبة من جديد وأعد إرساله، فالرابط يُخزَّن داخل الملف.</div>`;
      }else if(t.indexOf("PSA-ERR")>-1){
        box.innerHTML=`<div class="err" style="margin-top:12px"><b>الرابط يعمل لكن السكربت أخطأ:</b><br>${esc(t.slice(0,220))}
          <br>الغالب أنك لم تضع معرّف الجدول في <code>SHEET_ID</code>، أو أنشأت مشروعاً مستقلاً بدل Extensions ← Apps Script.</div>`;
      }else if(/accounts\.google\.com|Sign in|Choose an account/i.test(t)){
        box.innerHTML=`<div class="err" style="margin-top:12px"><b>الرابط يطلب تسجيل دخول.</b>
          أعد النشر واختر <b>Who has access: Anyone</b> — لا «Anyone with Google account».</div>`;
      }else{
        box.innerHTML=`<div class="warn" style="margin-top:12px"><b>جواب غير متوقع.</b> الغالب أن الكود المنشور نسخة قديمة بلا <code>doGet</code>.
          الصق الكود الجديد، واحفظ، ثم <b>Deploy ← Manage deployments ← تعديل ← New version</b>.
          <br><code>${esc(t.slice(0,160))}</code></div>`;
      }
    }catch(err){
      box.innerHTML=`<div class="err" style="margin-top:12px"><b>تعذّر الوصول إلى الرابط.</b> ${esc(err.message||"")}
        <br>تحقق من الاتصال بالإنترنت، ومن صحة الرابط، ومن أن النشر تمّ فعلاً.</div>`;
    }

  $("#s7").onclick=()=>{syncRanks();RANKS.sort((a,b)=>a[1]-b[1]);RANKS.forEach((r,i)=>r[2]=i+1);drawRanks();toast("حُفظت المستويات")};

  $("#s4").onclick=()=>{W.forEach((w,i)=>{const v=+$(`[data-nd="${i}"]`).value;w.need=isNaN(v)?60:v});toast("حُفظت الحدود")};
  $("#c-reset").onclick=()=>{$("#c-accent").value="#B08D3E";toast("أُعيد اللون الافتراضي")};
  $("#logoup").onclick=()=>$("#logof").click();
  $("#logodel").onclick=()=>{CFG.logo="";toast("أُزيل الشعار");vSet()};
  $("#logof").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      if(f.type==="image/svg+xml"){CFG.logo=r.result;toast("رُفع الشعار");vSet();return}
      const img=new Image();
      img.onload=()=>{
        const M=340,sc=Math.min(1,M/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        let out="";
        try{out=cv.toDataURL("image/webp",0.86)}catch(x){}
        if(!out||out.indexOf("image/webp")<0)out=cv.toDataURL("image/png");
        if(out.length>400000)return toast("الصورة كبيرة — استخدم صورة أبسط");
        CFG.logo=out;toast("رُفع الشعار ("+Math.round(out.length/1024)+" كيلوبايت)");vSet();
      };
      img.onerror=()=>toast("تعذّرت قراءة الصورة");
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };

    (CFG.outcomes||[]).forEach((o,i)=>o.id=o.id||("O"+(i+1)));
    const used={};W.forEach(w=>w.q.forEach(q=>{if(q.lo)used[q.lo]=(used[q.lo]||0)+1}));
    const ids=(CFG.outcomes||[]).map(o=>o.id);
    const orphan=Object.keys(used).filter(k=>!ids.includes(k));
    const empty=ids.filter(k=>!used[k]);
    $("#lomsg").innerHTML=`<div class="${orphan.length||empty.length?"warn":"ok"}" style="margin-top:11px">
      حُفظت المخرجات.
      ${empty.length?"<br><b>مخرجات بلا أسئلة:</b> "+empty.join("، ")+" — لن تُقاس.":""}
      ${orphan.length?"<br><b>أسئلة مرتبطة بمخرج محذوف:</b> "+orphan.join("، ")+" — أعد ربطها من تبويب المحتوى.":""}</div>`;
    toast("حُفظت المخرجات")};
  $("#s3").onclick=()=>{$("#gs").innerHTML=`<div class="warn" style="margin-top:12px"><b>خطوات الربط بالترتيب — لا تتجاوز خطوة:</b>
     <ol style="margin:8px 0 0;padding-inline-start:20px;line-height:2">
       <li>أنشئ جدول بيانات جديد على Google Sheets.</li>
       <li>انسخ من رابط الجدول الجزء الطويل بين <code>/d/</code> و <code>/edit</code> — هذا هو معرّف الجدول.</li>
       <li>من الجدول نفسه: <b>Extensions ← Apps Script</b> (لا تنشئ مشروعاً مستقلاً).</li>
       <li>امسح كل الكود الموجود، والصق الكود أدناه كاملاً.</li>
       <li>استبدل <code>ضع_معرّف_الجدول_هنا</code> بالمعرّف الذي نسخته.</li>
       <li>اضغط <b>Save</b> (أيقونة القرص) — هذه الخطوة تُنسى كثيراً.</li>
       <li><b>Deploy ← New deployment</b> ← الترس ← <b>Web app</b>.</li>
       <li>‏<b>Execute as: Me</b> · <b>Who has access: Anyone</b> — وليس «Anyone with Google account».</li>
       <li>‏<b>Deploy</b> ← وافق على التحذير (Advanced ← Go to … unsafe ← Allow).</li>
       <li>انسخ الرابط المنتهي بـ <code>/exec</code> — لا الذي ينتهي بـ <code>/dev</code>.</li>

       <li>وأخيراً: <b>ابنِ ملف الطلبة من جديد وأعد إرساله</b> — الرابط يُخزَّن داخل الملف.</li>

function drawLO(){
  const O=CFG.outcomes||[];
  const used={};W.forEach(w=>w.q.forEach(q=>{if(q.lo)used[q.lo]=(used[q.lo]||0)+1}));
  $("#lo").innerHTML=`<div class="tw"><table><thead><tr><th style="width:74px">الرمز</th><th>نص المخرج</th><th style="width:92px">الأسئلة</th><th style="width:70px"></th></tr></thead>
   <tbody>${O.map((o,i)=>`<tr>
    <td><input data-oi="${i}" value="${esc(o.id||"O"+(i+1))}" style="text-align:center"></td>
    <td><input data-ot="${i}" value="${esc(o.t||"")}" style="text-align:start"></td>
    <td><span class="tag ${used[o.id]?"ok":"no"}">${used[o.id]||0}</span></td>
    <td><button class="btn d sm" data-od="${i}">حذف</button></td></tr>`).join("")}</tbody></table></div>`;
  $$("#lo [data-od]").forEach(b=>b.onclick=()=>{syncLO();CFG.outcomes.splice(+b.dataset.od,1);drawLO()});
}
function syncLO(){(CFG.outcomes||[]).forEach((o,i)=>{const a=$(`[data-oi="${i}"]`);if(!a)return;
  o.id=a.value.trim()||("O"+(i+1));o.t=$(`[data-ot="${i}"]`).value})}

function drawRanks(){

function serialize(){
  const j=o=>JSON.stringify(o,null,0);
  return "\nconst CFG="+j(CFG)+";\nconst W="+j(W)+";\nconst RANKS="+j(RANKS)+";\nconst MEDALS="+j(MEDALS)+";\n";

function validate(){
  const p=[];const T=q=>q.t||"mcq";
  W.forEach(w=>{
    if(!w.t.trim())p.push("المحطة "+w.n+": العنوان فارغ");
    if(!w.boss){
      if(!w.q.length)p.push("المحطة "+w.n+": لا توجد أسئلة");
      w.q.forEach((q,i)=>{
        const L=`المحطة ${w.n} · سؤال ${i+1}`,t=T(q);
        if(!String(q.q||"").trim())p.push(L+": النص فارغ");
        if(!String(q.w||"").trim())p.push(L+": التفسير فارغ");
        if(t==="mcq"||t==="tf"){
          if(!q.o||q.o.length<2)p.push(L+": يحتاج خيارين على الأقل");
          else{
            if(q.o.some(o=>!String(o).trim()))p.push(L+": خيار فارغ");
            if(new Set(q.o).size!==q.o.length)p.push(L+": خيارات مكررة");
            if(!(q.c>=0&&q.c<q.o.length))p.push(L+": لم تُحدَّد الإجابة الصحيحة");
          }
        }
        else if(t==="multi"){
          if(!q.o||q.o.length<3)p.push(L+": يحتاج ثلاثة خيارات على الأقل");
          else if(q.o.some(o=>!String(o).trim()))p.push(L+": خيار فارغ");
          if(!q.c||!q.c.length)p.push(L+": لم تُعلَّم أي إجابة صحيحة");
          else if(q.c.length===(q.o||[]).length)p.push(L+": كل الخيارات صحيحة — لا معنى للسؤال");
        }
        else if(t==="short"){if(!q.ans||!q.ans.length||q.ans.some(a=>!String(a).trim()))p.push(L+": لا توجد إجابة مقبولة")}
        else if(t==="num"){if(!isFinite(q.val))p.push(L+": القيمة الرقمية غير صالحة");
          if(q.tol<0)p.push(L+": هامش السماح سالب")}
        else if(t==="match"){
          if(!q.pairs||q.pairs.length<2)p.push(L+": يحتاج زوجين على الأقل");
          else{if(q.pairs.some(x=>!String(x[0]).trim()||!String(x[1]).trim()))p.push(L+": زوج ناقص (استخدم علامة =)");
            const R=q.pairs.map(x=>x[1]);if(new Set(R).size!==R.length)p.push(L+": تكرار في الطرف الثاني يمنع التصحيح")}
        }
        else if(t==="order"){
          if(!q.items||q.items.length<3)p.push(L+": يحتاج ثلاثة عناصر على الأقل");
          else if(new Set(q.items).size!==q.items.length)p.push(L+": عناصر مكررة");
        }
        else if(t==="cloze"){
          const txt=String(q.text||""),B=q.blanks||[];
          if(!B.length)p.push(L+": لا توجد فراغات");
          B.forEach((b,k)=>{
            if(txt.indexOf("{"+(k+1)+"}")<0)p.push(L+`: الفراغ {${k+1}} غير موجود في النص`);
            if(!b.o||b.o.length<2)p.push(L+`: الفراغ ${k+1} يحتاج خيارين على الأقل`);
            else if(new Set(b.o).size!==b.o.length)p.push(L+`: الفراغ ${k+1} فيه خيارات مكررة`);
          });
          const extra=(txt.match(/\{\d+\}/g)||[]).length;
          if(extra>B.length)p.push(L+": في النص فراغات أكثر من الخيارات المعرَّفة");
        }
        else if(t==="cat"){
          const C=q.cats||[];
          if(C.length<2)p.push(L+": يحتاج فئتين على الأقل");
          if(C.some(c=>!c.name.trim()||!c.items.length))p.push(L+": فئة بلا اسم أو بلا عناصر");
          const all=C.flatMap(c=>c.items);
          if(new Set(all).size!==all.length)p.push(L+": عنصر مكرر في أكثر من فئة");
        }
        else if(t==="essay"){if(!String(q.model||"").trim())p.push(L+": الإجابة النموذجية فارغة")}
      });
      w.ch.forEach((c,i)=>{
        const L=`المحطة ${w.n} · تحدي ${i+1}`;
        if(c.t==="order"&&(!c.items||c.items.length<3))p.push(L+": يحتاج ثلاثة عناصر على الأقل");
        if(c.t==="match"&&(!c.pairs||c.pairs.length<2))p.push(L+": يحتاج زوجين على الأقل");
        if(c.t==="match"&&(c.pairs||[]).some(x=>!x[1]))p.push(L+": يوجد زوج بلا شرح (استخدم علامة =)");
      });
      if(w.cards.some(c=>!c[0].trim()||!c[1].trim()))p.push("المحطة "+w.n+": بطاقة ناقصة");
    }else{
      let n=0;(w.pool||[]).forEach(x=>{const t=W.find(y=>y.n===x);if(t)n+=t.q.length});
      if(n<w.count)p.push(`المحطة ${w.n}: بنك الأسئلة (${n}) أقل من المطلوب (${w.count})`);
    }
    w.file.forEach((s,i)=>{if(!s.h.trim())p.push(`المحطة ${w.n} · قسم ${i+1}: العنوان فارغ`)});
  });
  const O=(CFG&&CFG.outcomes)||[];
  if(O.length){
    const ids=O.map(o=>o.id);
    let noLo=0,orphan=new Set();
    W.forEach(w=>{if(w.boss)return;w.q.forEach(q=>{
      if(!q.lo)noLo++; else if(!ids.includes(q.lo))orphan.add(q.lo)})});
    if(noLo)p.push(`تنبيه: ${noLo} سؤالاً بلا مخرج تعلم — لن يُحتسب في تقرير التحقّق`);
    if(orphan.size)p.push("تنبيه: أسئلة مرتبطة بمخرجات محذوفة ("+[...orphan].join("، ")+")");
    const used={};W.forEach(w=>w.q.forEach(q=>{if(q.lo)used[q.lo]=1}));
    const dead=ids.filter(x=>!used[x]);
    if(dead.length)p.push("تنبيه: مخرجات بلا أسئلة ("+dead.join("، ")+") — لن تُقاس");
  }
  return p;
}

/* مولّد باركود QR (وضع البايت، تصحيح M، الإصدارات 1-10) */
function qrMatrix(text){
  const ECC=[10,16,26,18,24,16,18,22,22,26],NB=[1,1,1,2,2,4,4,4,5,5];
  const bytes=Array.from(new TextEncoder().encode(text));
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r};
  const cap=v=>Math.floor(raw(v)/8)-ECC[v-1]*NB[v-1];
  let ver=1;for(;ver<=10;ver++){if(4+(ver<10?8:16)+bytes.length*8<=cap(ver)*8)break}
  if(ver>10)return null;
  const bb=[],put=(v,n)=>{for(let i=n-1;i>=0;i--)bb.push((v>>>i)&1)};
  put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
  const cb=cap(ver)*8;put(0,Math.min(4,cb-bb.length));while(bb.length%8)bb.push(0);
  for(let pad=0xEC;bb.length<cb;pad^=0xEC^0x11)put(pad,8);
  const data=[];for(let i=0;i<bb.length;i+=8){let x=0;for(let j=0;j<8;j++)x=x*2+bb[i+j];data.push(x)}
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const ecl=ECC[ver-1],nb=NB[ver-1];
  const div=(()=>{const r=new Array(ecl).fill(0);r[ecl-1]=1;let root=1;
    for(let i=0;i<ecl;i++){for(let j=0;j<ecl;j++){r[j]=mul(r[j],root);if(j+1<ecl)r[j]^=r[j+1]}root=mul(root,2)}return r})();
  const rem=d=>{const r=new Array(ecl).fill(0);for(const b of d){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r};
  const rawCw=Math.floor(raw(ver)/8),nShort=nb-rawCw%nb,shortLen=Math.floor(rawCw/nb);
  const blocks=[];let k=0;
  for(let i=0;i<nb;i++){const len=shortLen-ecl+(i<nShort?0:1);const d=data.slice(k,k+len);k+=len;const e=rem(d);if(i<nShort)d.push(0);blocks.push(d.concat(e))}
  const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-ecl||j>=nShort)cw.push(b[i])});

function qrSVG(text){
  const M=qrMatrix(text);if(!M)return "";const n=M.length,q=4;let d="";
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(M[y][x])d+=`M${x+q},${y+q}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+q*2} ${n+q*2}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function qrPNG(text,cb){
  const M=qrMatrix(text);if(!M)return;const n=M.length,q=4,s=12,c=document.createElement("canvas");
  c.width=c.height=(n+q*2)*s;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.fillStyle="#000";
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(M[y][x])g.fillRect((x+q)*s,(y+q)*s,s,s);
  c.toBlob(cb,"image/png");
}

  let ni=0;const item={};
  if(ver>=4&&q+12<=bits.length){ni=gg(12);
    for(let k=0;k<ni;k++){const v=gg(2);if(v)item[k]=(v===1?1:2)}}

    :(ver===4)?(3+5+10*n+4+7*nlo+13+11+11+6+7+16+6+16+12+2*ni+8)
    :(3+5+7*n+13+11+11+6+7+16+6+16+8);

  return {v:ver,n:NM,i:ID,s:SC,x,b:best,fst:first,cver,a:an,k:co,f,e,mask,ch,lo,stage,item,stations:n,
    med:mask.toString(2).replace(/0/g,"").length,
    t:new Date(Date.UTC(2026,0,1)+hr*3600000).toISOString().slice(0,13).replace("T"," ")+":00"};
}

async function inflate(bytes){
  /* يجرّب zlib ثم raw deflate */
  for(const fmt of ["deflate","deflate-raw"]){
    try{
      const ds=new DecompressionStream(fmt);
      const st=new Blob([bytes]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(st).arrayBuffer());
    }catch(e){}
  }
  return null;
}
function bytesToLatin(b){let s="";const C=8192;for(let i=0;i<b.length;i+=C)s+=String.fromCharCode.apply(null,b.subarray(i,i+C));return s}

  const re=/(\d+)\s+0\s+obj([\s\S]{0,400}?)stream\r?\n/g;

  while((m=re.exec(s))!==null){
    const num=+m[1], head=m[2], start=m.index+m[0].length;
    const end=s.indexOf("endstream",start);
    if(end<0)continue;
    out.push({num,head,start,end,raw:buf.subarray(start,end)});
  }
  return {txt:s,objs:out};
}
function parseCMap(t){
  const map={};
  let m;
  const rc=/beginbfchar([\s\S]*?)endbfchar/g;
  while((m=rc.exec(t))!==null){
    const pairs=m[1].match(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g)||[];
    pairs.forEach(p=>{
      const g=p.match(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/);

    const body=m[1];
    const re2=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(<([0-9A-Fa-f]+)>|\[([\s\S]*?)\])/g;
    let x;
    while((x=re2.exec(body))!==null){
      const lo=parseInt(x[1],16), hi=parseInt(x[2],16);
      if(x[4]!==undefined){
        const base=parseInt(x[4],16);

      }else if(x[5]!==undefined){

      }

function fromHex(h,cur){

function fromLit(t,cur){

  segs.forEach(seg=>{
    /* أطول سلسلة من حروف الترميز داخل المقطع هي البيانات */
    const flat=seg.replace(/[\u0600-\u06FF]/g,"\n");
    let best="",bestAt=-1;
    const re=/[A-Za-z0-9_\-]+(?:\s+[A-Za-z0-9_\-]+)*/g;
    let m;
    while((m=re.exec(flat))!==null){
      const cand=m[0].replace(/\s+/g,"");
      if(cand.length>best.length){best=cand;bestAt=m.index}
    }
    if(best.length<20)return;
    let ident=cleanIdent(seg.slice(0,bestAt));
    /* إن التصق رقم الدفعة بأول البيانات فصله */
    out.push("P2|"+ident+"|"+best);
  });
  if(!out.length){
    t.split("\n").forEach(l=>{const s=l.trim();if(/^PSA[12][.|]/.test(s))out.push(s)});
  }
  return out;
}
function trimFix(code){
  const p=code.split("|");
  if(p.length<3)return null;
  const d=p[2];
  const cand=[];
  for(let a=0;a<=3;a++)for(let b=0;b<=3;b++){
    if(!a&&!b)continue;
    if(d.length-a-b<20)continue;
    cand.push(d.slice(a,d.length-b));
  }
  for(const c of cand){
    const full=p[0]+"|"+p[1]+"|"+c;
    try{ decodeAny(full); return full }catch(e){}
  }
  return null;
}
function tryRepair(code){
  /* إصلاح بالإجماع: لا يُقبل إلا إذا اتفقت كل الاحتمالات الناجحة على النتيجة نفسها،
     أو غلب احتمال واحد غلبةً ساحقة. وإلا يُرفض الرمز بدل اختراع درجة. */
  const p=code.split("|");
  if(p.length<3)return null;
  const data=p[2];
  if(data.length<20||data.length>400)return null;
  const groups={};
  let tested=0;
  for(let pos=0;pos<=data.length;pos++){
    for(let ci=0;ci<A64.length;ci++){
      const cand=p[0]+"|"+p[1]+"|"+data.slice(0,pos)+A64[ci]+data.slice(pos);
      let d;
      try{ d=decodeAny(cand) }catch(e){ continue }
      tested++;
      const sig=JSON.stringify([d.b,d.fst||{},d.lo,d.x,d.a,d.k,d.mask]);
      if(!groups[sig])groups[sig]={n:0,code:cand};
      groups[sig].n++;
    }
  }
  const arr=Object.keys(groups).map(k=>groups[k]).sort((a,b)=>b.n-a.n);
  if(!arr.length)return null;
  const win=arr[0], second=arr[1]?arr[1].n:0;
  if(arr.length===1 || (win.n>=10 && win.n>=10*second))
    return {code:win.code,fix:1,votes:win.n,rival:second};
  return {ambiguous:arr.length};
}
function tryRepairOld(code){
  const p=code.split("|");
  if(p.length<3)return null;
  const data=p[2];
  /* حرف واحد مفقود: جرّب إدراج A في كل موضع */
  for(let pos=data.length;pos>=0;pos--){
    const cand=p[0]+"|"+p[1]+"|"+data.slice(0,pos)+"A"+data.slice(pos);
    try{ decodeAny(cand); return {code:cand,fix:1} }catch(e){}
  }
  /* حرفان مفقودان: جرّب في ذيل الأصفار فقط */
  const tail=Math.max(0,data.length-30);
  for(let i=data.length;i>=tail;i--)for(let j=data.length;j>=tail;j--){
    const cand=p[0]+"|"+p[1]+"|"+data.slice(0,i)+"A"+data.slice(i,j)+"A"+data.slice(j);
    try{ decodeAny(cand); return {code:cand,fix:2} }catch(e){}
  }
  return null;
}

/* ===== تشخيص رمز واحد ===== */
function diagnoseCode(raw){
  const t=stripBidi(String(raw)).trim();
  const R=[];
  if(!t)return ["لم تلصق شيئاً."];
  const at=t.indexOf("P2|");
  if(at<0){
    if(/PSA[12]/.test(t))return ["الرمز من إصدار قديم جداً (PSA1/PSA2). اطلب من الطالب إصدار بطاقة جديدة."];
    return ["لا يحتوي النص على رمز: لم يُعثر على العلامة P2| — تأكد أنك نسخت الرمز كاملاً من أوله."];
  }
  const p=t.slice(at+3).split("|");
  if(p.length<2)return ["الرمز ناقص: لا يوجد سوى جزء واحد بعد P2| — المفترض جزآن: الهوية ثم البيانات."];
  const ident=p[0].trim();
  const rawData=p[1];
  const data=rawData.replace(/[^A-Za-z0-9_\-]/g,"");
  const dropped=rawData.replace(/\s/g,"").length-data.length;
  R.push("الهوية المقروءة: "+(ident||"(فارغة)"));
  R.push("طول جزء البيانات: "+data.length+" حرفاً"+(dropped?(" · وأُهملت "+dropped+" رموز غريبة"):""));
  let bits="";
  let badChar="";
  for(const c of data){const i=A64.indexOf(c);if(i<0){badChar=c;break}bits+=i.toString(2).padStart(6,"0")}
  if(badChar)return R.concat(["حرف غير صالح داخل البيانات: «"+badChar+"» — غالباً حرف عربي أو مسافة غير عادية تسلل أثناء النسخ."]);
  if(bits.length<40)return R.concat(["الرمز أقصر من أن يُقرأ — يبدو أنك نسخت جزءاً منه فقط."]);
  const ver=parseInt(bits.slice(0,3),2), n=parseInt(bits.slice(3,8),2);
  R.push("إصدار الرمز: "+ver+" · عدد المحطات المسجّل فيه: "+n);
  if(ver<3||ver>5)R.push("إصدار غير معروف — الرمز تالف من بدايته.");
  if(W.length&&n!==W.length)R.push("تحذير: الرمز يخص مساقاً فيه "+n+" محطة، والمساق المحمّل فيه "+W.length+" محطة.");
  try{
    const d=decodeAny(t);
    R.push("النتيجة: الرمز سليم ✓ — "+(d.n||"بلا اسم")+" · "+Object.keys(d.b).length+" محطة · "+d.x+" نقطة");
    return R;
  }catch(e){
    R.push("سبب الرفض: "+e.message);
    const fix=tryRepair(t);
    if(fix&&fix.code){
      try{const d2=decodeAny(fix.code);
        R.push("أمكن إصلاحه بيقين ✓ — سيُقبل عند الإضافة: "+Object.keys(d2.b).length+" محطة · "+d2.x+" نقطة");
      }catch(x){}
    }else if(fix&&fix.ambiguous){
      R.push("تعذّر الإصلاح: سقط منه أكثر من حرف، و"+fix.ambiguous+" قراءات مختلفة تجتاز الفحص — لا يمكن ترجيح إحداها بلا تخمين.");
      R.push("الحل: اطلب من الطالب إعادة إرسال الرمز في رسالة نصية مباشرة، لا داخل ملف Word أو PDF.");
    }else{
      R.push("الحل: اطلب إعادة إرسال الرمز كاملاً كنص.");
    }
    return R;
  }
}

function importCodes(txt){
  const list=extractCodes(txt);
  const res={added:0,fixed:0,failed:[],total:list.length};
  list.forEach(c=>{
    try{ ingest(decodeAny(c)); res.added++; }
    catch(e){
      const id=(c.split("|")[1]||"");
      const nm=id.split("~").filter(x=>x&&!/^[0-9]+$/.test(x.trim()))[0]||id.split("~")[0]||"—";
      const tf=trimFix(c);
      if(tf){ try{ ingest(decodeAny(tf)); res.added++; res.fixed++; return }catch(e3){} }
      const r=tryRepair(c);
      if(r&&r.code){
        try{ ingest(decodeAny(r.code)); res.added++; res.fixed++; return }catch(e2){}
      }
      res.failed.push({name:String(nm).trim().slice(0,34),
        why:(r&&r.ambiguous)?("تالف — "+r.ambiguous+" قراءات محتملة مختلفة، لا يمكن ترجيح إحداها"):e.message});
    }
  });
  return res;
}

    let flag="",why="";
    if(p===null){flag="na";why="لم يصل إليه أحد بعد"}
    else if(d!==null&&d<0){flag="bad";why="تمييز سالب: المتفوقون يخطئون فيه أكثر من الضعاف — راجع مفتاح الإجابة أو صياغة الخيارات"}
    else if(p<0.40&&(d===null||d>=0.20)){flag="hard";why="صعب لكنه يميّز جيداً: المحتوى نفسه لم يترسّخ — عزّز شرحه"}
    else if(p<0.40){flag="bad";why="صعب وضعيف التمييز: الغالب أن صياغته ملتبسة أو فيه خيار مضلل"}
    else if(p>0.92){flag="easy";why="سهل جداً ولا يميّز بين الطلبة — استبدله بسؤال أعمق"}
    else if(d!==null&&d<0.15){flag="weak";why="تمييز ضعيف: لا يفرّق بين المتقن وغيره"}
    else {flag="ok";why="فقرة سليمة"}
    return {...it,att,cor,p,d,flag,why};
  });
}
function loDiagnosis(){
  const S=itemStats(); if(!S)return null;
  const OUT=(CFG&&CFG.outcomes)||[],TGT=(CFG&&CFG.loTarget)||70;
  return OUT.map((o,k)=>{
    const key=o.id||("O"+(k+1));
    const items=S.filter(x=>x.lo===key&&x.p!==null);
    const avg=items.length?Math.round(items.reduce((a,b)=>a+b.p,0)/items.length*100):null;
    const weak=items.filter(x=>x.p<TGT/100).sort((a,b)=>a.p-b.p);
    const byW={};items.forEach(x=>{(byW[x.wn]=byW[x.wn]||[]).push(x)});
    const stations=Object.keys(byW).map(Number).map(n=>({n,t:byW[n][0].wt,
      p:Math.round(byW[n].reduce((a,b)=>a+b.p,0)/byW[n].length*100),q:byW[n].length}))
      .sort((a,b)=>a.p-b.p);
    const flawed=items.filter(x=>x.flag==="bad");
    const content=weak.filter(x=>x.flag==="hard");
    return {id:key,t:o.t,avg,ok:avg!==null&&avg>=TGT,n:items.length,
      weak,stations,flawed,content,
      gap:avg===null?null:TGT-avg};
  });
}

const AR_FIRST=["سالم","محمد","خالد","عبدالله","راشد","أحمد","سيف","ناصر","حمد","علي",
  "مروان","سلطان","عمر","فيصل","يوسف","ماجد","بدر","طارق","زايد","حسن",

const AR_LAST=["الكتبي","الشامسي","المزروعي","النقبي","السويدي","الظاهري","الحمادي","البلوشي",
  "الطنيجي","اليماحي","الشحي","النعيمي","الكعبي","المهيري","العلي"];
function genDemo(n){
  if(!W.length)return toast("حمّل ملف المساق أولاً");
  if(!confirm("سيُضاف "+n+" طالباً ببيانات تجريبية للعرض التوضيحي.\nتُوسَم كلها كتجريبية وتظهر في التقارير بتنويه واضح. متابعة؟"))return;
  const OUT=(CFG.outcomes||[]),TGT=CFG.loTarget||70,ST=STAT();
  const seenNames=new Set();
  for(let i=0;i<n;i++){
    let nm;do{nm=AR_FIRST[(Math.random()*AR_FIRST.length)|0]+" "+AR_LAST[(Math.random()*AR_LAST.length)|0]}
    while(seenNames.has(nm));seenNames.add(nm);
    /* قدرة الطالب: توزيع واقعي حول 72٪ */
    const ability=Math.max(35,Math.min(98, 72 + (Math.random()+Math.random()+Math.random()-1.5)*22 ));
    /* كم محطة أنجز */
    const reach=Math.max(1,Math.min(ST.length, Math.round(ST.length*(0.35+Math.random()*0.75)) ));
    const best={},lo={},stage={};
    const first={};
    for(let k=1;k<=reach;k++){
      const v=Math.max(20,Math.min(100,Math.round(ability+(Math.random()*24-12))));
      best[k]=v;
      first[k]=Math.max(10,Math.min(v,Math.round(v-(4+Math.random()*22))));
      stage[k]={r:1,c:Math.random()<.8?1:0,h:Math.random()<.6?1:0};
    }
    OUT.forEach((o,k)=>{
      /* مخرجات أصعب من غيرها ليكون التقرير واقعياً */
      const bias=[4,-9,2,6,-2,-12][k%6];
      lo["O"+(k+1)]=Math.max(15,Math.min(100,Math.round(ability+bias+(Math.random()*16-8))));
    });
    /* بيانات الفقرات: صعوبة لكل سؤال + قدرة الطالب */
    const item={};
    if(!window.__QDIF){window.__QDIF={};let gi=0;
      W.forEach(w=>{if(w.boss)return;w.q.forEach(()=>{window.__QDIF[gi++]=0.35+Math.random()*0.55})});}
    let gi2=0;
    W.forEach(w=>{if(w.boss)return;w.q.forEach(()=>{
      const gid=gi2++;
      if(w.n<=reach){
        const pr=Math.max(.05,Math.min(.97,(ability/100)*window.__QDIF[gid]*1.5));
        item[gid]=Math.random()<pr?1:2;
      }});});
    const done=Object.keys(best).filter(k=>best[k]>=((ST.find(s=>s.n==+k)||{}).need||60)).length;
    const nums=Object.values(best);
    const ans=reach*10+((Math.random()*30)|0);
    ROWS.push({key:"DEMO"+i,demo:1,
      name:nm, sid:"20"+(24-((Math.random()*2)|0))+String(1000+i).slice(-4),
      sec:["الأولى","الثانية","الثالثة"][i%3],
      xp:Math.round(reach*180*(ability/72)), best, fst:first, cver:(CFG&&CFG.version)||1, lo, stage, item, stations:ST.length,
      med:Math.min(12,Math.round(done*0.7+Math.random()*3)),
      ans, cor:Math.round(ans*ability/100), streak:2+((Math.random()*12)|0),
      errs:Math.max(0,Math.round((100-ability)/6)),
      done, avg:Math.round(nums.reduce((a,b)=>a+b,0)/ST.length),
      acc:Math.round(ability), ver:4,
      t:"2026-09-0"+(1+(i%7))+" "+(8+(i%9))+":00"});
  }
  toast("أُضيف "+n+" طالباً تجريبياً");
  render();
}

   ${ROWS.some(r=>r.demo)?`<div style="border:2px solid #a32b21;color:#a32b21;border-radius:6px;padding:9px 13px;margin-bottom:14px;font-weight:800;text-align:center">
     بيانات تجريبية للعرض التوضيحي — ليست نتائج طلبة حقيقيين</div>`:""}
   <div class="hd"><h1>تقرير تحقّق مخرجات التعلم</h1>
     <div class="sub">${esc((CFG&&CFG.academy)||"")} · ${esc((CFG&&CFG.course)||"")}${CFG&&CFG.teacher?" · "+esc(CFG.teacher):""}</div>
     <div class="sub">تاريخ التقرير: ${d} · عدد الطلبة في الحساب: ${withLo.length} · النسبة المستهدَفة: ${TGT}٪</div></div>
   <h2>أولاً: النتيجة الإجمالية</h2>
   <div class="box">تحقّق <b>${met}</b> من <b>${msr}</b> مخرجاً مقيساً بالنسبة المستهدَفة (${TGT}٪).
     ${met===msr?"جميع المخرجات المقيسة بلغت المستهدَف.":"المخرجات التي لم تبلغ المستهدَف مبيَّنة في الجدول أدناه، وتُرفق لها خطة تحسين."}</div>
   <h2>ثانياً: تفصيل المخرجات</h2>
   <table><thead><tr><th>الرمز</th><th>نص المخرج</th><th>متوسط التحقّق</th><th>المستهدَف</th>
     <th>نسبة الطلبة الذين بلغوه</th><th>الحالة</th></tr></thead><tbody>
   ${R.map(r=>`<tr><td>${esc(r.id)}</td><td class="s">${esc(r.t)}</td>
     <td>${r.avg===null?"—":r.avg+"٪"}</td><td>${TGT}٪</td>
     <td>${r.n?Math.round(r.pass/r.n*100)+"٪":"—"}</td>
     <td class="${r.avg===null?"":r.ok?"ok":"no"}">${r.avg===null?"لم يُقَس":r.ok?"تحقّق":"دون المستهدَف"}</td></tr>`).join("")}
   </tbody></table>
   ${R.some(r=>r.avg!==null&&!r.ok)?`<h2>ثالثاً: المخرجات التي تحتاج إجراءً تصحيحياً</h2>
     <table><thead><tr><th>الرمز</th><th>نص المخرج</th><th>الفجوة</th><th>الإجراء المقترح</th></tr></thead><tbody>
     ${R.filter(r=>r.avg!==null&&!r.ok).map(r=>`<tr><td>${esc(r.id)}</td><td class="s">${esc(r.t)}</td>
       <td>${TGT-r.avg} نقطة مئوية</td>
       <td class="s">مراجعة محتوى المحطات المرتبطة، وإعادة صياغة الأسئلة الأكثر خطأً، وإضافة نشاط تطبيقي داعم.</td></tr>`).join("")}
     </tbody></table>`:""}
   <div class="sig"><span>إعداد: ..............................</span>
     <span>اعتماد رئيس القسم: ..............................</span></div>
   </body></html>`;
  const w=window.open("","_blank");
  if(!w){dl(html,"outcomes_report.html","text/html;charset=utf-8");toast("نُزِّل التقرير — منع المتصفح النافذة")}
  else{w.document.write(html);w.document.close()}
}
function csvLO(){
  const TGT=(CFG&&CFG.loTarget)||70,OUT=(CFG&&CFG.outcomes)||[];
  const withLo=ROWS.filter(r=>r.lo&&Object.keys(r.lo).length);
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const head=["الاسم","الرقم العسكري","الدفعة",...OUT.map((o,k)=>(o.id||"O"+(k+1)))];
  const L=[];
  if(ROWS.some(r=>r.demo))L.push(q("بيانات تجريبية للعرض التوضيحي — ليست نتائج طلبة حقيقيين"));
  L.push(head.join(","));
  withLo.forEach(r=>L.push([r.name,r.sid,r.sec,...OUT.map((o,k)=>{const v=r.lo["O"+(k+1)];return v===null||v===undefined?"":v})].map(q).join(",")));
  L.push("");
  L.push(["متوسط الدفعة","","",...(window.__LOROWS||[]).map(x=>x.avg===null?"":x.avg)].map(q).join(","));
  L.push(["المستهدَف","","",...(window.__LOROWS||[]).map(()=>TGT)].map(q).join(","));
  L.push(["الحالة","","",...(window.__LOROWS||[]).map(x=>x.avg===null?"لم يُقَس":x.ok?"تحقّق":"دون المستهدَف")].map(q).join(","));
  dl("\ufeff"+L.join("\n"),"learning_outcomes.csv","text/csv;charset=utf-8");
  toast("صُدِّر تقرير المخرجات");
}

function expCSV(){
  const head=["الاسم","الرقم العسكري","الدفعة","محطات مكتملة","متوسط الدرجات","دقة الإجابة",
    "النقاط","الشارات","أطول متتالية","أخطاء معلّقة","عدد التحديثات","آخر تحديث",...STAT().map(w=>"م"+w.n)];
  const lines=[];
  if(ROWS.some(r=>r.demo))lines.push('"بيانات تجريبية للعرض التوضيحي — ليست نتائج طلبة حقيقيين"');
  lines.push(head.join(","));
  ROWS.forEach(r=>lines.push([r.name,r.sid,r.sec,r.done,r.avg,r.acc,r.xp,r.med,r.streak,r.errs,(r.updates||1),r.time,
    ...STAT().map(w=>r.best[w.n]??"")].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")));
  dl("\ufeff"+lines.join("\n"),"gradebook.csv","text/csv;charset=utf-8");
  toast("صُدِّر الملف");
}

nav();paint();
